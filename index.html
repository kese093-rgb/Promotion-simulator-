<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promotion Simulator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Главное меню -->
        <div id="main-menu" class="screen active">
            <div class="menu-container">
                <h1 class="game-title">🥊 Promotion Simulator</h1>
                <p class="subtitle">Реалистичный симулятор владельца промоушна единоборств</p>
                
                <div class="save-slots">
                    <div class="slot-card" onclick="startCareer()">
                        <div class="slot-icon">👤</div>
                        <h3>Слот 1: Карьера бойца</h3>
                        <p>Создайте бойца и пройдите путь к славе</p>
                        <button class="btn btn-primary">Начать карьеру</button>
                    </div>
                    
                    <div class="slot-card" onclick="startPromoter()">
                        <div class="slot-icon">🏢</div>
                        <h3>Слот 2: Промоутер</h3>
                        <p>Управляйте собственным промоушном</p>
                        <button class="btn btn-secondary">Создать промоушн</button>
                    </div>
                </div>
                
                <div id="load-section" style="display:none;">
                    <h3>Загрузить сохранение</h3>
                    <div id="saves-list"></div>
                </div>
            </div>
        </div>

        <!-- Создание бойца -->
        <div id="fighter-creator" class="screen">
            <div class="creator-container">
                <h2>👤 Создание бойца</h2>
                <div class="creator-form">
                    <div class="form-group">
                        <label>Имя</label>
                        <input type="text" id="fighter-firstname" placeholder="Имя" class="input">
                    </div>
                    <div class="form-group">
                        <label>Фамилия</label>
                        <input type="text" id="fighter-lastname" placeholder="Фамилия" class="input">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Возраст</label>
                            <input type="number" id="fighter-age" value="20" min="18" max="40" class="input">
                        </div>
                        <div class="form-group">
                            <label>Рост (см)</label>
                            <input type="number" id="fighter-height" value="180" min="150" max="220" class="input">
                        </div>
                        <div class="form-group">
                            <label>Вес (кг)</label>
                            <input type="number" id="fighter-weight" value="75" min="50" max="140" class="input">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Национальность</label>
                        <select id="fighter-nationality" class="input">
                            <option value="Россия">🇷🇺 Россия</option>
                            <option value="США">🇺🇸 США</option>
                            <option value="Бразилия">🇧🇷 Бразилия</option>
                            <option value="Франция">🇫🇷 Франция</option>
                            <option value="Япония">🇯🇵 Япония</option>
                            <option value="Великобритания">🇬🇧 Великобритания</option>
                            <option value="Нидерланды">🇳🇱 Нидерланды</option>
                            <option value="Австралия">🇦🇺 Австралия</option>
                        </select>
                    </div>
                    
                    <div class="appearance-section">
                        <h3>Внешность</h3>
                        <div class="fighter-preview" id="fighter-preview">
                            <div class="fighter-body" id="fighter-body"></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Цвет кожи</label>
                                <select id="fighter-skintone" class="input" onchange="updatePreview()">
                                    <option value="#F5D6C3">Светлый</option>
                                    <option value="#E8B88A">Средний</option>
                                    <option value="#C68642">Загорелый</option>
                                    <option value="#8D5524">Тёмный</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Цвет волос</label>
                                <select id="fighter-haircolor" class="input" onchange="updatePreview()">
                                    <option value="#1A1A1A">Чёрные</option>
                                    <option value="#4A3728">Тёмные</option>
                                    <option value="#8B6914">Русые</option>
                                    <option value="#D4A76A">Светлые</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="stats-preview">
                        <h3>Характеристики</h3>
                        <div id="stats-bars"></div>
                    </div>
                    
                    <button class="btn btn-primary btn-large" onclick="createFighter()">Создать бойца</button>
                </div>
            </div>
        </div>

        <!-- Создание промоушна -->
        <div id="promotion-creator" class="screen">
            <div class="creator-container">
                <h2>🏢 Создание промоушна</h2>
                <div class="creator-form">
                    <div class="form-group">
                        <label>Название промоушна</label>
                        <input type="text" id="promo-name" placeholder="Например: UFA, Apex FC" class="input">
                    </div>
                    <div class="form-group">
                        <label>Страна</label>
                        <select id="promo-country" class="input">
                            <option value="Россия">🇷🇺 Россия</option>
                            <option value="США">🇺🇸 США</option>
                            <option value="Бразилия">🇧🇷 Бразилия</option>
                            <option value="Япония">🇯🇵 Япония</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Стартовый бюджет ($)</label>
                        <input type="number" id="promo-budget" value="1000000" min="100000" max="10000000" step="100000" class="input">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Основной цвет</label>
                            <input type="color" id="promo-color1" value="#E31E24" class="input">
                        </div>
                        <div class="form-group">
                            <label>Дополнительный цвет</label>
                            <input type="color" id="promo-color2" value="#1A1A1A" class="input">
                        </div>
                    </div>
                    <button class="btn btn-primary btn-large" onclick="createPromotion()">Создать промоушн</button>
                </div>
            </div>
        </div>

        <!-- Панель бойца -->
        <div id="career-dashboard" class="screen">
            <div class="dashboard">
                <div class="sidebar">
                    <div class="fighter-card-mini" id="fighter-card-mini"></div>
                    <nav class="dashboard-nav">
                        <button class="nav-btn active" onclick="showCareerTab('overview')">📊 Обзор</button>
                        <button class="nav-btn" onclick="showCareerTab('training')">🏋️ Тренировки</button>
                        <button class="nav-btn" onclick="showCareerTab('fights')">🥊 Бои</button>
                        <button class="nav-btn" onclick="showCareerTab('contracts')">📋 Контракты</button>
                        <button class="nav-btn" onclick="showCareerTab('rankings')">🏆 Рейтинги</button>
                    </nav>
                    <button class="btn btn-back" onclick="goToMainMenu()">← В меню</button>
                </div>
                <div class="main-content" id="career-content"></div>
            </div>
        </div>

        <!-- Панель промоутера -->
        <div id="promotion-dashboard" class="screen">
            <div class="dashboard">
                <div class="sidebar">
                    <div class="promo-card-mini" id="promo-card-mini"></div>
                    <nav class="dashboard-nav">
                        <button class="nav-btn active" onclick="showPromoterTab('overview')">📊 Обзор</button>
                        <button class="nav-btn" onclick="showPromoterTab('roster')">👥 Бойцы</button>
                        <button class="nav-btn" onclick="showPromoterTab('events')">📅 Ивенты</button>
                        <button class="nav-btn" onclick="showPromoterTab('finances')">💰 Финансы</button>
                        <button class="nav-btn" onclick="showPromoterTab('rankings')">🏆 Рейтинги</button>
                    </nav>
                    <button class="btn btn-back" onclick="goToMainMenu()">← В меню</button>
                </div>
                <div class="main-content" id="promotion-content"></div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
