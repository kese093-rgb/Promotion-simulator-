<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Promotion Simulator Online</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --bg: #FFFFFF; --bg2: #F5F5F5; --text: #1A1A1A; --text2: #666666; --border: #E0E0E0; --red: #CC0000; --blue: #1A73E8; --gold: #D4A017; --green: #0D8043; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; font-size:18px; -webkit-text-size-adjust:100%; }
        .screen { display:none; }
        .screen.active { display:flex; flex-direction:column; min-height:100vh; }
        .menu-container { padding:30px 20px; text-align:center; max-width:600px; margin:0 auto; }
        .logo { font-size:36px; font-weight:900; } .logo span { color:var(--red); }
        .subtitle { color:var(--text2); margin:10px 0 30px; font-size:16px; }
        .btn { display:block; width:100%; padding:22px 20px; border:2px solid var(--border); border-radius:14px; font-size:20px; font-weight:700; cursor:pointer; background:var(--bg); margin-bottom:14px; min-height:60px; -webkit-tap-highlight-color:transparent; text-align:center; }
        .btn:active { opacity:0.7; }
        .btn-primary { background:var(--red); color:white; border-color:var(--red); }
        .btn-blue { background:var(--blue); color:white; border-color:var(--blue); }
        .btn-gold { background:var(--gold); color:white; border-color:var(--gold); }
        .btn-green { background:var(--green); color:white; border-color:var(--green); }
        .btn-danger { color:var(--red); border-color:var(--red); background:none; }
        .btn-back { background:none; border:none; color:var(--text2); font-size:16px; padding:12px 0; min-height:auto; width:auto; display:inline; margin-bottom:0; }
        .btn-small { display:inline-block; width:auto; padding:12px 18px; font-size:16px; min-height:auto; margin-bottom:0; }
        .creator-container { padding:25px 20px; max-width:600px; margin:0 auto; }
        .creator-container h2 { font-size:24px; margin-bottom:20px; }
        .form-group { margin-bottom:18px; }
        .form-group label { font-size:14px; font-weight:700; color:var(--text2); text-transform:uppercase; margin-bottom:6px; display:block; }
        .input, select { width:100%; padding:18px 16px; border:2px solid var(--border); border-radius:12px; font-size:18px; background:var(--bg); min-height:56px; font-family:inherit; }
        .dashboard { display:flex; flex-direction:column; min-height:100vh; }
        .topbar { background:var(--bg2); padding:10px; border-bottom:2px solid var(--border); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
        .topbar .player-info { padding:8px 12px; font-size:14px; display:flex; align-items:center; gap:8px; }
        .main-content { padding:15px; flex:1; overflow-y:auto; }
        .chat-panel { display:none; background:var(--bg2); padding:12px; }
        .chat-panel.open { display:flex; flex-direction:column; position:fixed; bottom:0; left:0; right:0; height:60vh; z-index:100; border-radius:20px 20px 0 0; border-top:2px solid var(--border); }
        #sidebar-nav { display:flex; flex-wrap:wrap; gap:6px; }
        .nav-btn { display:inline-block; width:auto; padding:14px 18px; font-size:17px; font-weight:600; background:var(--bg); border:2px solid var(--border); border-radius:12px; margin:5px; color:var(--text); min-height:50px; }
        .nav-btn.active { background:var(--text); color:white; border-color:var(--text); }
        .card-mini { padding:18px; background:var(--bg); border-radius:12px; border:2px solid var(--border); margin-bottom:12px; text-align:center; font-size:16px; }
        .stat-grid { display:flex; flex-direction:column; gap:12px; }
        .stat-card { padding:18px; background:var(--bg); border:2px solid var(--border); border-radius:12px; }
        .stat-card.selected { border-color:var(--red); background:#fff0f0; }
        .stat-card h3 { font-size:14px; color:var(--text2); text-transform:uppercase; }
        .stat-value { font-size:30px; font-weight:800; margin:8px 0; }
        .stat-bar { height:8px; background:var(--bg2); border-radius:4px; margin-top:8px; }
        .stat-bar-fill { height:100%; border-radius:4px; }
        .bar-energy { background:var(--blue); } .bar-prime { background:var(--gold); } .bar-hype { background:var(--red); }
        .data-table { width:100%; border-collapse:collapse; font-size:15px; }
        .data-table th { background:var(--bg2); padding:14px 10px; text-align:left; font-size:13px; text-transform:uppercase; color:var(--text2); border-bottom:2px solid var(--border); }
        .data-table td { padding:14px 10px; border-bottom:1px solid var(--border); }
        .chat-messages { flex:1; overflow-y:auto; margin-bottom:10px; }
        .chat-msg { padding:10px 0; border-bottom:1px solid var(--border); font-size:16px; }
        .chat-msg .name { font-weight:700; } .chat-msg .time { color:var(--text2); font-size:12px; }
        .chat-msg.system { color:var(--text2); font-style:italic; }
        .chat-input-area { display:flex; gap:8px; }
        .chat-input { flex:1; padding:16px; border:2px solid var(--border); border-radius:12px; font-size:16px; background:var(--bg); min-height:52px; }
        .online-badge { display:inline-block; background:var(--green); color:white; padding:6px 14px; border-radius:18px; font-size:14px; }
        .badge { display:inline-block; padding:5px 12px; border-radius:6px; font-size:14px; font-weight:700; }
        .badge-green { background:#e6f4ec; color:var(--green); } .badge-red { background:#fde8e8; color:var(--red); }
        .notification { padding:16px; background:var(--bg2); border-left:5px solid var(--blue); margin:10px 0; border-radius:0 10px 10px 0; font-size:16px; cursor:pointer; }
        .notification.unread { border-left-color:var(--red); font-weight:700; }
        .fight-log { background:var(--bg2); border-radius:10px; padding:16px; margin:12px 0; font-size:16px; max-height:45vh; overflow-y:auto; }
        .fight-log p { margin:8px 0; padding:8px 0; border-bottom:1px solid var(--border); }
        .toggle-chat-btn { position:fixed; bottom:20px; right:20px; z-index:200; background:var(--blue); color:white; border-radius:50%; width:56px; height:56px; font-size:24px; font-weight:700; box-shadow:0 4px 16px rgba(0,0,0,0.2); display:flex; align-items:center; justify-content:center; padding:0; }
    </style>
</head>
<body>
    <div id="app">
        <div id="menu" class="screen active">
            <div class="menu-container">
                <div class="logo">PROMOTION<span>SIM</span></div>
                <p class="subtitle">Онлайн <span id="online-count" class="online-badge">0</span></p>
                <button class="btn btn-primary btn-large" onclick="showCreator('fighter')">👤 Создать бойца</button>
                <button class="btn btn-blue btn-large" onclick="showCreator('promotion')">🏢 Создать промоушн</button>
                <div id="save-slots" style="margin-top:20px;"></div>
            </div>
        </div>
        <div id="fighter-creator" class="screen">
            <div class="creator-container">
                <h2>Создание бойца</h2>
                <div class="form-group"><label>Имя</label><input type="text" id="f-name" class="input" placeholder="Имя"></div>
                <div class="form-group"><label>Фамилия</label><input type="text" id="f-surname" class="input" placeholder="Фамилия"></div>
                <div class="form-group"><label>Возраст</label><select id="f-age" class="input"><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option></select></div>
                <div class="form-group"><label>Страна</label><select id="f-country" class="input"><option>Россия</option><option>Дагестан</option><option>Армения</option><option>Украина</option><option>Грузия</option><option>Абхазия</option><option>Испания</option><option>Франция</option><option>Германия</option><option>Бразилия</option><option>Англия</option><option>США</option></select></div>
                <div class="form-group"><label>Стиль</label><select id="f-style" class="input"><option value="boxing">Бокс</option><option value="kickboxing">Кикбоксинг</option><option value="wrestling">Борьба</option></select></div>
                <div id="preview-stats" style="background:var(--bg2);padding:12px;border-radius:8px;margin:12px 0;"></div>
                <button class="btn btn-primary btn-large" onclick="createFighter()">Создать бойца</button>
                <button class="btn btn-back" onclick="showScreen('menu')">← Назад</button>
            </div>
        </div>
        <div id="promotion-creator" class="screen">
            <div class="creator-container">
                <h2>Создание промоушна</h2>
                <div class="form-group"><label>Имя менеджера</label><input type="text" id="promo-manager" class="input" placeholder="Ваше имя"></div>
                <div class="form-group"><label>Название</label><input type="text" id="promo-name" class="input" placeholder="Название"></div>
                <div class="form-group"><label>Спорт</label><select id="promo-sport" class="input"><option>MMA</option><option>BOXING</option><option>WRESTLING</option></select></div>
                <div class="form-group"><label>Страна</label><select id="promo-country" class="input"><option>Россия</option><option>США</option><option>Бразилия</option><option>Франция</option><option>Япония</option></select></div>
                <button class="btn btn-blue btn-large" onclick="createPromotion()">Создать промоушн</button>
                <button class="btn btn-back" onclick="showScreen('menu')">← Назад</button>
            </div>
                                                                                           </div>
                                                                                                   <div id="dashboard" class="screen">
            <div class="dashboard">
                <div class="topbar">
                    <div class="player-info"><strong id="sidebar-name">Игрок</strong> <span id="sidebar-info" style="color:var(--text2);"></span></div>
                    <nav id="sidebar-nav"></nav>
                    <button class="btn btn-small btn-danger" onclick="logout()">Выйти</button>
                </div>
                <div class="main-content"><div id="content-area"></div></div>
                <div class="chat-panel" id="chat-panel">
                    <h3>💬 Чат <span id="chat-online" class="online-badge">0</span></h3>
                    <div class="chat-messages" id="chat-messages"></div>
                    <div class="chat-input-area">
                        <input type="text" id="chat-input" class="chat-input" placeholder="Сообщение..." onkeypress="if(event.key==='Enter')sendChat()">
                        <button class="btn btn-blue btn-small" onclick="sendChat()">Отправить</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <button class="btn toggle-chat-btn" onclick="toggleChat()">💬</button>

    <script>
// ============================================
// ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
// ============================================
var socket = null;
var myPlayer = null;
var myMode = null;
var gameData = { fighters: [], promotions: [], messages: [], notifications: [], onlineCount: 0, events: [] };
var currentTab = 'overview';
var lastTrainTime = {};
var selectedFighters = [];
var currentEventId = null;

// ============================================
// НАВИГАЦИЯ
// ============================================
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
    var el = document.getElementById(id);
    if (el) el.classList.add('active');
}
function showCreator(type) {
    if (type === 'fighter') showScreen('fighter-creator');
    else showScreen('promotion-creator');
    if (type === 'fighter') updatePreviewStats();
}
function logout() {
    if (socket) socket.disconnect();
    socket = null; myPlayer = null; myMode = null;
    showScreen('menu'); updateSaveSlots();
}

// ============================================
// СОХРАНЕНИЯ (2 слота)
// ============================================
function saveCareer() {
    var f = findMyFighter();
    if (!f) return;
    localStorage.setItem('ps_career', JSON.stringify({ fighter: f, lastTrainTime: lastTrainTime, timestamp: Date.now() }));
    updateSaveSlots();
}
function savePromotion() {
    var p = findMyPromotion();
    if (!p) return;
    localStorage.setItem('ps_promoter', JSON.stringify({ promotion: p, timestamp: Date.now() }));
    updateSaveSlots();
}
function updateSaveSlots() {
    var container = document.getElementById('save-slots');
    if (!container) return;
    var html = '<h3 style="margin-top:10px;">💾 Слоты сохранений</h3>';
    var cd = localStorage.getItem('ps_career');
    if (cd) {
        try { var s = JSON.parse(cd); html += '<div class="card-mini" style="cursor:pointer;padding:10px;" onclick="loadCareer()"><strong>👤 '+s.fighter.fullName+'</strong><br><span style="font-size:12px;color:var(--text2);">'+new Date(s.timestamp).toLocaleString('ru')+'</span></div>'; } catch(e) {}
    } else { html += '<div class="card-mini" style="padding:10px;color:var(--text2);">👤 Слот бойца пуст</div>'; }
    var pd = localStorage.getItem('ps_promoter');
    if (pd) {
        try { var s = JSON.parse(pd); html += '<div class="card-mini" style="cursor:pointer;padding:10px;" onclick="loadPromotion()"><strong>🏢 '+s.promotion.name+'</strong><br><span style="font-size:12px;color:var(--text2);">'+new Date(s.timestamp).toLocaleString('ru')+'</span></div>'; } catch(e) {}
    } else { html += '<div class="card-mini" style="padding:10px;color:var(--text2);">🏢 Слот менеджера пуст</div>'; }
    container.innerHTML = html;
}
function loadCareer() {
    var d = localStorage.getItem('ps_career');
    if (!d) return;
    var s = JSON.parse(d);
    lastTrainTime = s.lastTrainTime || {};
    autoConnect(s.fighter.fullName, 'fighter');
    setTimeout(function() {
        var exists = false;
        for (var i = 0; i < gameData.fighters.length; i++) { if (gameData.fighters[i].id === s.fighter.id) { gameData.fighters[i] = s.fighter; exists = true; break; } }
        if (!exists) gameData.fighters.push(s.fighter);
        showScreen('dashboard'); buildSidebar(); showTab('overview');
    }, 600);
}
function loadPromotion() {
    var d = localStorage.getItem('ps_promoter');
    if (!d) return;
    var s = JSON.parse(d);
    autoConnect(s.promotion.name + ' Manager', 'promoter');
    setTimeout(function() {
        var exists = false;
        for (var i = 0; i < gameData.promotions.length; i++) { if (gameData.promotions[i].id === s.promotion.id) { gameData.promotions[i] = s.promotion; exists = true; break; } }
        if (!exists) gameData.promotions.push(s.promotion);
        showScreen('dashboard'); buildSidebar(); showTab('overview');
    }, 600);
}

// ============================================
// УДАЛЕНИЕ КАРЬЕРЫ
// ============================================
function deleteCareer() {
    if (!confirm('Точно удалить карьеру бойца?')) return;
    localStorage.removeItem('ps_career');
    if (socket && myPlayer) socket.emit('deleteFighter', { playerId: myPlayer.id });
    myMode = null;
    showScreen('menu'); updateSaveSlots();
}
function deletePromotion() {
    if (!confirm('Точно удалить промоушн?')) return;
    localStorage.removeItem('ps_promoter');
    if (socket && myPlayer) socket.emit('deletePromotion', { playerId: myPlayer.id });
    myMode = null;
    showScreen('menu'); updateSaveSlots();
}

// ============================================
// ПОДКЛЮЧЕНИЕ К СЕРВЕРУ (с авто-переподключением)
// ============================================
function autoConnect(name, mode) {
    myPlayer = { name: name, id: null };
    myMode = mode || null;
    
    if (socket && socket.connected) {
        socket.emit('register', { name: name });
        return;
    }
    
    socket = io({
        reconnection: true,
        reconnectionAttempts: Infinity,
        reconnectionDelay: 1000,
        reconnectionDelayMax: 5000
    });
    
    socket.on('connect', function() { socket.emit('register', { name: name }); });
    
    socket.on('reconnect', function() {
        console.log('Переподключился!');
        if (myPlayer && myPlayer.name) { socket.emit('register', { name: myPlayer.name }); }
    });
    
    socket.on('registered', function(data) {
        myPlayer.id = data.id;
        document.getElementById('sidebar-name').textContent = name;
        document.getElementById('sidebar-info').textContent = 'Онлайн';
        buildSidebar();
        showScreen('dashboard');
        showTab('overview');
    });
    socket.on('serverState', function(data) {
        gameData.fighters = data.fighters || [];
        gameData.promotions = data.promotions || [];
        gameData.messages = data.messages || [];
        gameData.notifications = data.notifications || [];
        gameData.events = data.events || [];
        gameData.onlineCount = data.onlineCount || 0;
        updateOnlineCount(); renderChatMessages(); updateMailBadge();
        if (document.getElementById('dashboard').classList.contains('active')) showTab(currentTab);
    });
    socket.on('playerJoined', function(data) { gameData.onlineCount = data.onlineCount; updateOnlineCount(); addChatMessage({ from: 'Система', text: data.message, system: true, time: new Date().toISOString() }); });
    socket.on('playerLeft', function(data) { gameData.onlineCount = data.onlineCount; updateOnlineCount(); addChatMessage({ from: 'Система', text: data.message, system: true, time: new Date().toISOString() }); });
    socket.on('newMessage', function(msg) { addChatMessage(msg); });
    socket.on('fighterCreated', function(f) { gameData.fighters.push(f); if (document.getElementById('dashboard').classList.contains('active')) showTab(currentTab); });
    socket.on('promotionCreated', function(p) { gameData.promotions.push(p); });
    socket.on('notification', function(n) { gameData.notifications.unshift(n); updateMailBadge(); });
    socket.on('disconnect', function() { document.getElementById('sidebar-info').textContent = 'Переподключение...'; });
}

function updateOnlineCount() {
    var oc = document.getElementById('online-count'), co = document.getElementById('chat-online');
    if (oc) oc.textContent = gameData.onlineCount + ' онлайн';
    if (co) co.textContent = gameData.onlineCount;
}

// ============================================
// САЙДБАР
// ============================================
function buildSidebar() {
    var nav = document.getElementById('sidebar-nav');
    if (!nav) return;
    var html = '<button class="nav-btn active" onclick="showTab(\'overview\')">Обзор</button>';
    html += '<button class="nav-btn" onclick="showTab(\'allfighters\')">Бойцы</button>';
    html += '<button class="nav-btn" onclick="showTab(\'promotions\')">Промоушны</button>';
    if (myMode === 'fighter') {
        html += '<button class="nav-btn" onclick="showTab(\'training\')">Тренировки</button>';
        html += '<button class="nav-btn" onclick="showTab(\'fights\')">Бои</button>';
        html += '<button class="nav-btn" onclick="showTab(\'shop\')">Магазин</button>';
    }
    if (myMode === 'promoter') {
        html += '<button class="nav-btn" onclick="showTab(\'myroster\')">Ростер</button>';
        html += '<button class="nav-btn" onclick="showTab(\'events\')">Карды</button>';
        html += '<button class="nav-btn" onclick="showTab(\'finances\')">Финансы</button>';
    }
    html += '<button class="nav-btn" onclick="showTab(\'mail\')">📬 Почта <span id="mail-badge" class="badge badge-red" style="display:none;">0</span></button>';
    nav.innerHTML = html;
}
function showTab(tab) {
    currentTab = tab;
    var nav = document.getElementById('sidebar-nav');
    if (nav) { nav.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); }); }
    renderTabContent(tab);
}

// ============================================
// ПОИСК
// ============================================
function findMyFighter() {
    if (!myPlayer || !myPlayer.id) return null;
    for (var i = 0; i < gameData.fighters.length; i++) { if (gameData.fighters[i].ownerId === myPlayer.id && !gameData.fighters[i].isBot) return gameData.fighters[i]; }
    return null;
}
function findMyPromotion() {
    if (!myPlayer || !myPlayer.id) return null;
    for (var i = 0; i < gameData.promotions.length; i++) { if (gameData.promotions[i].ownerId === myPlayer.id && !gameData.promotions[i].isAI) return gameData.promotions[i]; }
    return null;
}
function findFighterById(id) { for (var i = 0; i < gameData.fighters.length; i++) { if (gameData.fighters[i].id === id) return gameData.fighters[i]; } return null; }
function findPromoById(id) { for (var i = 0; i < gameData.promotions.length; i++) { if (gameData.promotions[i].id === id) return gameData.promotions[i]; } return null; }
      // ============================================
// РЕНДЕР ВКЛАДОК
// ============================================
function renderTabContent(tab) {
    var area = document.getElementById('content-area');
    if (!area) return;
    if (tab === 'overview') {
        if (myMode === 'fighter') {
            var f = findMyFighter();
            area.innerHTML = f ? renderFighterOverview(f) : '<h2>Обзор</h2><p style="color:var(--text2);">Создайте бойца в главном меню.</p><p>Онлайн: '+gameData.onlineCount+' | Бойцов: '+gameData.fighters.length+' | Промоушнов: '+gameData.promotions.length+'</p>';
        } else if (myMode === 'promoter') {
            var p = findMyPromotion();
            area.innerHTML = p ? renderPromotionOverview(p) : '<h2>Обзор</h2><p style="color:var(--text2);">Создайте промоушн в главном меню.</p><p>Онлайн: '+gameData.onlineCount+' | Бойцов: '+gameData.fighters.length+' | Промоушнов: '+gameData.promotions.length+'</p>';
        } else {
            area.innerHTML = '<h2>Обзор</h2><p>Онлайн: '+gameData.onlineCount+'</p><p>Бойцов в мире: '+gameData.fighters.length+'</p><p>Промоушнов: '+gameData.promotions.length+'</p><p style="color:var(--text2);">Создайте бойца или промоушн через главное меню.</p>';
        }
    } else if (tab === 'allfighters') { area.innerHTML = renderAllFighters(); }
    else if (tab === 'promotions') { area.innerHTML = renderPromotions(); }
    else if (tab === 'training') { area.innerHTML = renderTraining(); }
    else if (tab === 'fights') { area.innerHTML = renderFights(); }
    else if (tab === 'shop') { area.innerHTML = renderShop(); }
    else if (tab === 'mail') { area.innerHTML = renderMail(); }
    else if (tab === 'myroster') { area.innerHTML = renderMyRoster(); }
    else if (tab === 'events') { area.innerHTML = renderMyEvents(); }
    else if (tab === 'finances') { area.innerHTML = renderMyFinances(); }
}

// ============================================
// НАВЫКИ ПО СТИЛЮ И ВОЗРАСТУ
// ============================================
function getBaseStats(style, age) {
    var s = { boxing: 0, wrestling: 0, submission: 0, kick: 0, speed: 0, stamina: 0, strength: 0 };
    if (style === 'boxing') {
        if (age <= 23) { s.boxing = 6; s.wrestling = 1; s.submission = 1; s.kick = 1; s.speed = 6; s.stamina = 6; s.strength = 5; }
        else { s.boxing = 10; s.wrestling = 1; s.submission = 1; s.kick = 1; s.speed = 10; s.stamina = 10; s.strength = 5; }
    } else if (style === 'wrestling') {

    return s;
}

function trainSkill(skill) {
    var f = findMyFighter();
    if (!f || (f.energy || 100) < 10) { alert('Недостаточно энергии!'); return; }
    var now = Date.now(), key = f.id + '_' + skill;
    if (lastTrainTime[key] && (now - lastTrainTime[key]) < 7200000) { alert('Подождите, навык на перезарядке!'); return; }
    f[skill] = Math.min(100, (f[skill] || 0) + 1);
    f.energy = Math.max(0, (f.energy || 100) - 10);
    f.prime = Math.min(100, (f.prime || 0) + 1);
    lastTrainTime[key] = now;
    if (socket) socket.emit('updateFighter', f);
    saveCareer();
    showTab('training');
}

function getCommentary(a, d, type) { var t = fightTemplates[type] || fightTemplates['box']; return t[Math.floor(Math.random() * t.length)].replace('{a}', '<strong>' + a + '</strong>').replace('{d}', '<strong>' + d + '</strong>'); }

function startFight(oppId) {

        '<button class="btn btn-primary btn-large" onclick="watchFight(\'' + oppId + '\')">👀 Смотреть бой</button>' +
        '<button class="btn btn-large" onclick="skipFight(\'' + oppId + '\')" style="margin-top:5px;">⏩ Пропустить</button>';
}

function resolveFight(oppId, tactic) {
    var f = findMyFighter(), o = null;
    for (var i = 0; i < gameData.fighters.length; i++) { if (gameData.fighters[i].id === oppId) { o = gameData.fighters[i]; break; } }
    if (!f || !o) return null;

    var oppTactic = o.tactic || ['balance', 'box', 'wrestle'][Math.floor(Math.random() * 3)];

    var s1 = 0, s2 = 0;
    if (tactic === 'box') s1 = (f.boxing || 0) * 2 + (f.speed || 0) + (f.strength || 0);
    else if (tactic === 'wrestle') s1 = (f.wrestling || 0) * 2 + (f.strength || 0) + (f.submission || 0);
    else if (tactic === 'counter_box') s1 = (f.boxing || 0) + (f.speed || 0) + (f.submission || 0) + 5;
    else if (tactic === 'counter_wrestle') s1 = (f.wrestling || 0) + (f.strength || 0) + (f.submission || 0) + 5;
    else s1 = (f.boxing || 0) + (f.wrestling || 0) + (f.speed || 0);

    if (oppTactic === 'box') s2 = (o.boxing || 0) * 2 + (o.speed || 0) + (o.strength || 0);
    else if (oppTactic === 'wrestle') s2 = (o.wrestling || 0) * 2 + (o.strength || 0) + (o.submission || 0);
    else if (oppTactic === 'counter_box') s2 = (o.boxing || 0) + (o.speed || 0) + (o.submission || 0) + 5;
    else if (oppTactic === 'counter_wrestle') s2 = (o.wrestling || 0) + (o.strength || 0) + (o.submission || 0) + 5;
    else s2 = (o.boxing || 0) + (o.wrestling || 0) + (o.speed || 0);

    s1 += (f.prime || 0) / 10 + (f.hype || 0) / 20 + Math.floor(Math.random() * 7) - 3;
    s2 += (o.prime || 0) / 10 + (o.hype || 0) / 20 + Math.floor(Math.random() * 7) - 3;
    s1 *= (f.energy || 100) / 100;
    s2 *= (o.energy || 100) / 100;

    var commentary = ['🥊 ' + f.fullName + ' (тактика: ' + tactic + ') vs ' + o.fullName + ' (тактика: ' + oppTactic + ')'];
    var rounds = 5 + Math.floor(Math.random() * 4);
    for (var r = 0; r < rounds; r++) {
        var actor = Math.random() < (s1 / (s1 + s2)) ? f : o;
        var defender = actor.id === f.id ? o : f;
        var types = ['box', 'wrestle'];
        if ((actor.kick || 0) > 5) types.push('kick');
        if ((actor.submission || 0) > 5) types.push('submission');
        if (Math.random() < 0.3) types.push('defense');
        commentary.push(getCommentary(actor.fullName, defender.fullName, types[Math.floor(Math.random() * types.length)]));
    }

    var won = s1 > s2, ko = Math.abs(s1 - s2) > 15;
    if (ko && won) commentary.push('💥 ТЯЖЁЛЫЙ НОКАУТ! ' + f.fullName + ' вырубает соперника!');
    else if (ko && !won) commentary.push('💥 НОКАУТ! ' + o.fullName + ' отправляет ' + f.fullName + ' в глубокий сон!');
    else if (won) commentary.push('🏆 ' + f.fullName + ' побеждает решением судей!');
    else commentary.push('💔 ' + o.fullName + ' побеждает решением судей...');

    return { winner: won ? f : o, loser: won ? o : f, ko: ko, commentary: commentary };
}

function watchFight(oppId) {
    var tactic = document.getElementById('fight-tactic').value;
    var result = resolveFight(oppId, tactic);
    if (!result) return;
    var area = document.getElementById('content-area');
    area.innerHTML = '<h2>🥊 Бой</h2><div class="fight-log" id="fight-log"></div>';
    var i = 0;
    function nextLine() {
        if (i < result.commentary.length) {
            var log = document.getElementById('fight-log');
            if (log) { log.innerHTML += '<p>' + result.commentary[i] + '</p>'; log.scrollTop = log.scrollHeight; }
            i++;
            setTimeout(nextLine, 2000);
        } else {
            applyFightResult(result);
            var winnerText = result.winner.id === findMyFighter().id ? '🏆 ПОБЕДА!' : '💔 ПОРАЖЕНИЕ';
            area.innerHTML += '<p style="font-size:1.2rem;margin-top:10px;">' + winnerText + '</p>';
            area.innerHTML += '<button class="btn btn-primary btn-large" onclick="showTab(\'fights\')">Продолжить</button>';
        }
    }
    setTimeout(nextLine, 500);
}

function skipFight(oppId) {
    var tactic = document.getElementById('fight-tactic').value;
    var result = resolveFight(oppId, tactic);
    if (!result) return;
    applyFightResult(result);
    showTab('fights');
    alert(result.commentary[result.commentary.length - 1]);
}

function applyFightResult(result) {
    var w = result.winner, l = result.loser;
    if (!w.records) w.records = { wins: 0, losses: 0, ko: 0 };
    if (!l.records) l.records = { wins: 0, losses: 0, ko: 0 };
    w.records.wins++; l.records.losses++;
    if (result.ko) w.records.ko = (w.records.ko || 0) + 1;
    w.energy = Math.max(0, (w.energy || 100) - 20);
    l.energy = Math.max(0, (l.energy || 100) - 35);
    w.prime = Math.min(100, (w.prime || 0) + 30);
    l.prime = Math.max(0, (l.prime || 0) - 30);
    w.hype = Math.min(100, (w.hype || 0) + (result.ko ? 15 : 10));
    w.coins = (w.coins || 0) + Math.floor(Math.random() * 150) + 50;
    l.coins = (l.coins || 0) + Math.floor(Math.random() * 30) + 10;
    if (socket) { socket.emit('updateFighter', w); socket.emit('updateFighter', l); }
    saveCareer();
      }

// МАГАЗИН
// ============================================
function renderShop() {
    var f = findMyFighter();
    if (!f) return '<p style="color:var(--text2);">Создайте бойца!</p>';
    var h = '<h2>🛒 Магазин</h2><p style="margin-bottom:15px;">Ваши монеты: 🪙 <strong>' + (f.coins || 0) + '</strong></p><div class="stat-grid">';
    h += '<div class="stat-card"><h3>Прозвище</h3><p style="font-size:0.8rem;">Уникальное прозвище для бойца</p><p>🪙 1000</p><button class="btn btn-gold btn-small" onclick="buyNickname()">Купить</button></div>';
    h += '<div class="stat-card"><h3>Дорогая вещь</h3><p style="font-size:0.8rem;">+10 к хайпу</p><p>🪙 1500</p><button class="btn btn-gold btn-small" onclick="buyItem()">Купить</button></div>';
    h += '<div class="stat-card"><h3>Пожертвование</h3><p style="font-size:0.8rem;">+5 к хайпу</p><p>🪙 1000</p><button class="btn btn-green btn-small" onclick="buyDonation()">Купить</button></div>';
    h += '<div class="stat-card"><h3>Именные шорты</h3><p style="font-size:0.8rem;">+3 к хайпу</p><p>🪙 500</p><button class="btn btn-green btn-small" onclick="buyShorts()">Купить</button></div>';
    h += '</div>';
    return h;
}

function buyNickname() {

}
function buyItem() {

    f.coins -= 1500;
    f.hype = Math.min(100, (f.hype || 0) + 10);

    showTab('shop');

}
function buyDonation() {
    var f = findMyFighter();

// ============================================
// ЧАТ
// ============================================
function sendChat() {
    var input = document.getElementById('chat-input');
    var text = input.value.trim();
    if (!text || !socket || !myPlayer) return;
    socket.emit('chatMessage', { name: myPlayer.name, text: text });
    input.value = '';
}
function addChatMessage(msg) {
    gameData.messages.push(msg);
    if (gameData.messages.length > 200) gameData.messages.shift();
    renderChatMessages();
}
function renderChatMessages() {
    var container = document.getElementById('chat-messages');
    if (!container) return;
    var html = '';
    var msgs = gameData.messages.slice(-30);
    for (var i = 0; i < msgs.length; i++) {
        var m = msgs[i];
        var time = new Date(m.time).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
        if (m.system) html += '<div class="chat-msg system">' + m.text + ' <span class="time">' + time + '</span></div>';
        else html += '<div class="chat-msg"><span class="name">' + m.from + ':</span> ' + m.text + ' <span class="time">' + time + '</span></div>';
    }
    container.innerHTML = html || '<p style="color:var(--text2);">Нет сообщений</p>';
    container.scrollTop = container.scrollHeight;
}
function toggleChat() {
    var panel = document.getElementById('chat-panel');
    if (panel) panel.classList.toggle('open');
}

// ============================================
// ПОЧТА И УВЕДОМЛЕНИЯ
// ============================================
function updateMailBadge() {
    var badge = document.getElementById('mail-badge');
    if (!badge) return;
    var unread = 0;
    for (var i = 0; i < gameData.notifications.length; i++) { if (!gameData.notifications[i].read) unread++; }
    badge.style.display = unread > 0 ? 'inline' : 'none';
    badge.textContent = unread;
}
function renderMail() {
    var h = '<h2>📬 Почта</h2>';
    if (gameData.notifications.length === 0) {
        h += '<p style="color:var(--text2);">Нет уведомлений.</p>';
    } else {
        for (var i = 0; i < gameData.notifications.length; i++) {
            var n = gameData.notifications[i];
            var dateStr = new Date(n.time || n.createdAt).toLocaleString('ru');
            h += '<div class="notification' + (n.read ? '' : ' unread') + '" onclick="markRead(' + i + ')">';
            h += '<strong>' + dateStr + '</strong><br>' + n.message;
            if (n.type === 'application' && myMode === 'promoter') {
                h += '<br><button class="btn btn-green btn-small" style="margin-top:5px;" onclick="acceptApp(\'' + n.fighterId + '\',' + n.amount + ',' + i + ')">Принять заявку</button>';
            }
            h += '</div>';
        }
    }
    return h;
}
function markRead(index) { if (gameData.notifications[index]) gameData.notifications[index].read = true; updateMailBadge(); showTab('mail'); }
function acceptApp(fighterId, amount, notifIndex) {
    var p = findMyPromotion();
    if (!p) { alert('Создайте промоушн!'); return; }
    var f = findFighterById(fighterId);
    if (!f) { alert('Боец не найден!'); return; }
    if (p.budget < amount) { alert('Недостаточно средств! Бюджет: 🪙' + (p.budget || 0)); return; }
    p.budget -= amount;
    p.expenses = (p.expenses || 0) + amount;
    if (!p.roster) p.roster = [];
    p.roster.push(f.id);
    f.currentPromotionId = p.id;
    f.coins = (f.coins || 0) + amount;
    if (gameData.notifications[notifIndex]) gameData.notifications[notifIndex].read = true;
    if (socket) { socket.emit('updateFighter', f); socket.emit('updatePromotion', p); }
    savePromotion();
    updateMailBadge();
    showTab('mail');
    alert(f.fullName + ' принят в ростер за 🪙' + amount + '!');
}
      // ============================================
// ПРОМОУШН — ОТРИСОВКА
// ============================================
function renderPromotionOverview(p) {
    var h = '<h2>📊 ' + p.name + '</h2><div class="stat-grid">';
    h += '<div class="stat-card"><h3>💰 Бюджет</h3><div class="stat-value" style="color:var(--green);">🪙' + (p.budget || 0) + '</div></div>';
    h += '<div class="stat-card"><h3>⭐ Популярность</h3><div class="stat-value">' + (p.popularity || 0) + '%</div></div>';
    h += '<div class="stat-card"><h3>🏆 Спорт</h3><div class="stat-value" style="font-size:1.2rem;">' + (p.sport || 'MMA') + '</div></div>';
    h += '<div class="stat-card"><h3>👥 Бойцы в ростере</h3><div class="stat-value">' + (p.roster ? p.roster.length : 0) + '</div></div>';
    h += '<div class="stat-card"><h3>📅 Карды</h3><div class="stat-value">' + (p.events ? p.events.length : 0) + '</div></div>';
    h += '</div><button class="btn btn-green" onclick="savePromotion();alert(\'Промоушн сохранён!\')">💾 Сохранить</button>';
    h += '<button class="btn btn-danger" onclick="deletePromotion()" style="margin-top:0.5rem;">🗑 Удалить промоушн</button>';
    return h;
}

function renderMyRoster() {
    var p = findMyPromotion();
    if (!p) return '<p style="color:var(--text2);">Создайте промоушн!</p>';
    var rosterFighters = [];
    for (var i = 0; i < gameData.fighters.length; i++) {
        if (p.roster && p.roster.indexOf(gameData.fighters[i].id) !== -1) rosterFighters.push(gameData.fighters[i]);
    }
    var h = '<h2>📋 Мой ростер (' + rosterFighters.length + ' бойцов)</h2>';
    if (rosterFighters.length === 0) {
        h += '<p style="color:var(--text2);">Ростер пуст.</p>';
        h += '<p style="color:var(--text2);">Подпишите бойцов через вкладку "Бойцы" или принимайте заявки через "Почту".</p>';
    } else {
        h += '<table class="data-table"><thead><tr><th>Боец</th><th>Стиль</th><th>Рекорд</th><th>Хайп</th><th></th></tr></thead><tbody>';
        for (var i = 0; i < rosterFighters.length; i++) {
            var f = rosterFighters[i], rec = f.records || { wins: 0, losses: 0 };
            h += '<tr><td><strong>' + f.fullName + '</strong></td><td>' + f.baseStyle + '</td><td>' + rec.wins + '-' + rec.losses + '</td><td>' + (f.hype || 0) + '</td>';
            h += '<td><button class="btn btn-danger btn-small" onclick="removeFromRoster(\'' + f.id + '\')">Уволить</button></td></tr>';
        }
        h += '</tbody></table>';
    }
    return h;
}

function removeFromRoster(fighterId) {
    var p = findMyPromotion();
    if (!p) return;
    if (!confirm('Уволить бойца из ростера?')) return;
    p.roster = p.roster.filter(function(id) { return id !== fighterId; });
    var f = findFighterById(fighterId);
    if (f) f.currentPromotionId = null;
    if (socket) { socket.emit('updatePromotion', p); if (f) socket.emit('updateFighter', f); }
    savePromotion();
    showTab('myroster');
}

// ============================================
// КАРДЫ С КАЛЕНДАРЁМ (выбор бойцов нажатием)
// ============================================
function renderMyEvents() {
    var p = findMyPromotion();
    if (!p) return '<p style="color:var(--text2);">Создайте промоушн!</p>';
    var myEvents = [];
    for (var i = 0; i < gameData.events.length; i++) {
        if (gameData.events[i].promotionId === p.id) myEvents.push(gameData.events[i]);
    }
    myEvents.sort(function(a, b) { return new Date(a.date) - new Date(b.date); });
    var now = new Date();
    var h = '<h2>📅 Календарь кардов (' + myEvents.length + ')</h2>';
    h += '<button class="btn btn-blue btn-large" onclick="createCard()">➕ Создать новый кард</button>';
    if (myEvents.length > 0) {
        h += '<div class="stat-grid" style="margin-top:1rem;">';
        for (var i = 0; i < myEvents.length; i++) {
            var evt = myEvents[i], d = new Date(evt.date);
            var dateStr = d.toLocaleDateString('ru', { day: 'numeric', month: 'long', year: 'numeric' });
            var isPast = d < now, isToday = d.toDateString() === now.toDateString();
            h += '<div class="stat-card" style="' + (isPast ? 'opacity:0.6;' : '') + (isToday ? 'border-color:var(--red);border-width:3px;' : '') + '">';
            h += '<h3>' + evt.name + (isToday ? ' 🔴 СЕГОДНЯ' : '') + (isPast ? ' ✓' : '') + '</h3>';
            h += '<p style="font-size:0.8rem;">📅 ' + dateStr + (isPast ? ' (завершён)' : '') + '</p>';
            h += '<p style="font-size:0.8rem;">Бои: ' + (evt.fights ? evt.fights.length : 0) + '/3</p>';
            if (evt.fights) {
                for (var j = 0; j < evt.fights.length; j++) {
                    var fight = evt.fights[j], f1 = findFighterById(fight.fighter1), f2 = findFighterById(fight.fighter2);
                    h += '<p style="font-size:0.7rem;">' + (j === 0 ? '⭐ Главный бой: ' : '') + (f1 ? f1.fullName : '?') + ' vs ' + (f2 ? f2.fullName : '?') + ' | 🪙' + (fight.purse1 || 0) + '/' + (fight.purse2 || 0) + '</p>';
                }
            }
            if (!isPast && (!evt.fights || evt.fights.length < 3)) {
                h += '<button class="btn btn-small btn-green" onclick="openFightSelector(\'' + evt.id + '\')">+ Добавить бой</button>';
            }
            h += '</div>';
        }
        h += '</div>';
    } else {
        h += '<p style="color:var(--text2);margin-top:1rem;">Нет запланированных кардов. Создайте первый кард!</p>';
    }
    return h;
}

function createCard() {
    var p = findMyPromotion();
    if (!p || !socket) return;
    var name = prompt('Название карда:', p.name + ' Fight Night');
    if (!name) return;
    var dateStr = prompt('Дата проведения (ДД.ММ.ГГГГ):', new Date(Date.now() + 14 * 86400000).toLocaleDateString('ru'));
    if (!dateStr) return;
    var parts = dateStr.split('.');
    var date = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
    socket.emit('createEvent', { name: name, promotionId: p.id, date: date.toISOString(), fights: [] });
    savePromotion();
    setTimeout(function() { showTab('events'); }, 500);
}

function openFightSelector(eventId) {
    var p = findMyPromotion();
    if (!p) return;
    var rosterFighters = [];
    for (var i = 0; i < gameData.fighters.length; i++) {
        if (p.roster && p.roster.indexOf(gameData.fighters[i].id) !== -1) rosterFighters.push(gameData.fighters[i]);
    }
    if (rosterFighters.length < 2) { alert('Нужно минимум 2 бойца в ростере!'); return; }
    selectedFighters = [];
    currentEventId = eventId;
    var area = document.getElementById('content-area');
    var h = '<h2>Выберите двух бойцов</h2><p>Выбрано: <strong id="selected-count">0</strong>/2</p><div class="stat-grid" id="fighter-selector">';
    for (var i = 0; i < rosterFighters.length; i++) {
        var f = rosterFighters[i];
        h += '<div class="stat-card" id="fcard-' + f.id + '" onclick="selectForCard(\'' + f.id + '\')" style="cursor:pointer;"><h3>' + f.fullName + '</h3><p style="font-size:0.8rem;">' + f.baseStyle + ' | Рекорд: ' + ((f.records || {}).wins || 0) + '-' + ((f.records || {}).losses || 0) + ' | Хайп: ' + (f.hype || 0) + '</p></div>';
    }
    h += '</div><button class="btn btn-primary btn-large" id="confirm-fight-btn" onclick="confirmFightSelection()" disabled>✅ Подтвердить бой</button><button class="btn btn-back" onclick="showTab(\'events\')">← Назад</button>';
    area.innerHTML = h;
      }
      function selectForCard(fighterId) {
    var idx = selectedFighters.indexOf(fighterId);
    if (idx !== -1) {
        selectedFighters.splice(idx, 1);
        var card = document.getElementById('fcard-' + fighterId);
        if (card) { card.classList.remove('selected'); card.style.borderColor = 'var(--border)'; card.style.background = 'var(--bg)'; }
    } else {
        if (selectedFighters.length >= 2) { alert('Уже выбрано 2 бойца!'); return; }
        selectedFighters.push(fighterId);
        var card = document.getElementById('fcard-' + fighterId);
        if (card) { card.classList.add('selected'); card.style.borderColor = 'var(--red)'; card.style.background = '#fff0f0'; }
    }
    document.getElementById('selected-count').textContent = selectedFighters.length;
    document.getElementById('confirm-fight-btn').disabled = selectedFighters.length !== 2;
}

function confirmFightSelection() {
    if (selectedFighters.length !== 2 || !currentEventId) return;
    var p = findMyPromotion();
    var evt = null;
    for (var i = 0; i < gameData.events.length; i++) { if (gameData.events[i].id === currentEventId) { evt = gameData.events[i]; break; } }
    if (!evt || (evt.fights && evt.fights.length >= 3)) { alert('Максимум 3 боя на кард!'); return; }
    var f1 = findFighterById(selectedFighters[0]), f2 = findFighterById(selectedFighters[1]);
    var purse1 = parseInt(prompt('Гонорар для ' + f1.fullName + ':\nСлабый: 50-100 | Средний: 100-250 | Сильный: 250-500'));
    var purse2 = parseInt(prompt('Гонорар для ' + f2.fullName + ':'));
    if (!purse1 || !purse2 || (p.budget || 0) < (purse1 + purse2)) { alert('Недостаточно средств! Бюджет: 🪙' + (p.budget || 0)); return; }
    p.budget -= (purse1 + purse2);
    p.expenses = (p.expenses || 0) + (purse1 + purse2);
    f1.coins = (f1.coins || 0) + purse1;
    f2.coins = (f2.coins || 0) + purse2;
    if (!evt.fights) evt.fights = [];
    evt.fights.push({ fighter1: f1.id, fighter2: f2.id, purse1: purse1, purse2: purse2, isMain: evt.fights.length === 0 });
    if (socket) { socket.emit('updateEvent', evt); socket.emit('updatePromotion', p); socket.emit('updateFighter', f1); socket.emit('updateFighter', f2); }
    savePromotion();
    showTab('events');
}

// ============================================
// ФИНАНСЫ
// ============================================
function renderMyFinances() {
    var p = findMyPromotion();
    if (!p) return '<p style="color:var(--text2);">Создайте промоушн!</p>';
    var h = '<h2>💰 Финансы</h2><div class="stat-grid">';
    h += '<div class="stat-card"><h3>💰 Баланс</h3><div class="stat-value" style="color:var(--green);">🪙' + (p.budget || 0) + '</div></div>';
    h += '<div class="stat-card"><h3>📈 Доходы</h3><div class="stat-value" style="color:var(--green);">🪙' + (p.revenue || 0) + '</div></div>';
    h += '<div class="stat-card"><h3>📉 Расходы</h3><div class="stat-value" style="color:var(--red);">🪙' + (p.expenses || 0) + '</div></div>';
    h += '</div><button class="btn btn-green" onclick="savePromotion();alert(\'Сохранено!\')">💾 Сохранить</button>';
    return h;
}

// ============================================
// ЗАПУСК
// ============================================
window.onload = function() {
    showScreen('menu');
    updateSaveSlots();

    socket = io({
        reconnection: true,
        reconnectionAttempts: Infinity,
        reconnectionDelay: 1000,
        reconnectionDelayMax: 5000
    });
    
    socket.on('connect', function() { socket.emit('register', { name: 'Гость' }); });
    socket.on('reconnect', function() { socket.emit('register', { name: 'Гость' }); });
    socket.on('registered', function(data) { myPlayer = { id: data.id, name: 'Гость' }; });
    socket.on('serverState', function(data) {
        gameData.fighters = data.fighters || [];
        gameData.promotions = data.promotions || [];
        gameData.messages = data.messages || [];
        gameData.notifications = data.notifications || [];
        gameData.events = data.events || [];
        gameData.onlineCount = data.onlineCount || 0;
        updateOnlineCount();
        updateSaveSlots();
    });
    socket.on('playerJoined', function(data) { gameData.onlineCount = data.onlineCount; updateOnlineCount(); });
    socket.on('playerLeft', function(data) { gameData.onlineCount = data.onlineCount; updateOnlineCount(); });
    socket.on('newMessage', function(msg) { addChatMessage(msg); });
    socket.on('fighterCreated', function(f) { gameData.fighters.push(f); });
    socket.on('promotionCreated', function(p) { gameData.promotions.push(p); });
    socket.on('notification', function(n) { gameData.notifications.unshift(n); updateMailBadge(); });
    socket.on('disconnect', function() { if (document.getElementById('sidebar-info')) document.getElementById('sidebar-info').textContent = 'Переподключение...'; });

    var fs = document.getElementById('f-style'), fa = document.getElementById('f-age');
    if (fs) fs.addEventListener('change', updatePreviewStats);
    if (fa) fa.addEventListener('change', updatePreviewStats);
    updatePreviewStats();
};

// Восстановление энергии каждые 30 секунд
setInterval(function() {
    var f = findMyFighter();
    if (f && (f.energy || 100) < (f.maxEnergy || 100)) {
        f.energy = Math.min(f.maxEnergy || 100, (f.energy || 100) + 5);
    }
}, 30000);
