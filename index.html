<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promotion Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0A0E17;
            color: #E8ECF1;
            min-height: 100vh;
        }

        .screen {
            display: none;
            min-height: 100vh;
        }

        .screen.active {
            display: flex;
        }

        .menu-container {
            max-width: 900px;
            margin: 80px auto;
            padding: 40px;
            text-align: center;
            width: 100%;
        }

        .game-title {
            font-size: 56px;
            font-weight: 900;
            background: linear-gradient(135deg, #E31E24, #F59E0B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #8892B0;
            font-size: 18px;
            margin-bottom: 60px;
        }

        .save-slots {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 40px;
        }

        .slot-card {
            background: #1C2541;
            border: 2px solid #2D3A52;
            border-radius: 16px;
            padding: 40px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .slot-card:hover {
            border-color: #E31E24;
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(227, 30, 36, 0.2);
        }

        .slot-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .slot-card h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .slot-card p {
            color: #8892B0;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #E31E24;
            color: white;
        }

        .btn-primary:hover {
            background: #C41A20;
        }

        .btn-secondary {
            background: #3B82F6;
            color: white;
        }

        .btn-secondary:hover {
            background: #2563EB;
        }

        .btn-back {
            background: transparent;
            border: 2px solid #2D3A52;
            color: #8892B0;
            width: 100%;
            margin-top: 20px;
        }

        .btn-back:hover {
            background: #1C2541;
            color: #E8ECF1;
        }

        .btn-large {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            margin-top: 30px;
        }

        .creator-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 40px;
            background: #141B2D;
            border-radius: 16px;
            width: 100%;
        }

        .creator-container h2 {
            font-size: 32px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #8892B0;
        }

        .input {
            width: 100%;
            padding: 12px;
            background: #0A0E17;
            border: 2px solid #2D3A52;
            border-radius: 8px;
            color: #E8ECF1;
            font-size: 16px;
        }

        .input:focus {
            outline: none;
            border-color: #E31E24;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .appearance-section {
            margin: 30px 0;
            padding: 20px;
            background: #0A0E17;
            border-radius: 12px;
        }

        .appearance-section h3 {
            margin-bottom: 15px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
            width: 100%;
        }

        .sidebar {
            background: #141B2D;
            padding: 20px;
            border-right: 2px solid #2D3A52;
        }

        .main-content {
            padding: 30px;
            overflow-y: auto;
        }

        .card-mini {
            padding: 20px;
            background: #1C2541;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .dashboard-nav {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .nav-btn {
            width: 100%;
            padding: 12px;
            text-align: left;
            background: transparent;
            border: none;
            color: #8892B0;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: #1C2541;
            color: #E8ECF1;
        }

        .nav-btn.active {
            background: #E31E24;
            color: white;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .stat-card {
            background: #1C2541;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #2D3A52;
        }

        .stat-card h3 {
            font-size: 14px;
            color: #8892B0;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .stat-bar {
            height: 8px;
            background: #0A0E17;
            border-radius: 4px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s;
        }

        .bar-health {
            background: #10B981;
        }

        .bar-energy {
            background: #3B82F6;
        }

        .bar-morale {
            background: #F59E0B;
        }

        .data-table {
            width: 100%;
            background: #1C2541;
            border-radius: 12px;
            overflow: hidden;
            border-collapse: collapse;
        }

        .data-table th {
            background: #141B2D;
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: #8892B0;
        }

        .data-table td {
            padding: 16px;
            border-top: 1px solid #2D3A52;
        }

        .data-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .load-section {
            margin-top: 30px;
            padding: 20px;
            background: #1C2541;
            border-radius: 12px;
        }

        .load-section h3 {
            margin-bottom: 15px;
        }

        .save-item {
            padding: 12px;
            margin: 8px 0;
            background: #141B2D;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
        }

        .save-item:hover {
            background: #2D3A52;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .save-slots {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .game-title {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Главное меню -->
        <div id="main-menu" class="screen active">
            <div class="menu-container">
                <h1 class="game-title">Promotion Simulator</h1>
                <p class="subtitle">Реалистичный симулятор владельца промоушна единоборств</p>

                <div class="save-slots">

                    <h3>📂 Загрузить сохранение</h3>
                    <div id="saves-list"></div>
                </div>
            </div>
  </div>

</div>

    <script>
    // ============================================
    // PROMOTION SIMULATOR - ОСНОВНОЙ КОД
    // ============================================

    // Хранилище данных игры
    var GameState = {
        mode: null,
        player: null,
        promotions: [],
        fighters: [],
        currentDate: new Date('2024-01-01'),
        events: [],
        saveSlots: {}
    };

    // Вспомогательные функции
    function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateId() {
        return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    }

    // Данные для генерации
    var FIRST_NAMES = ['Алексей', 'Дмитрий', 'Иван', 'Максим', 'Артём', 'Александр', 'Михаил', 'Сергей', 'Андрей', 'Николай', 'Маркус', 'Джеймс', 'Рашид', 'Карлос', 'Такуми'];
    var LAST_NAMES = ['Волков', 'Соколов', 'Орлов', 'Медведев', 'Козлов', 'Петров', 'Иванов', 'Смирнов', 'Попов', 'Новиков', 'Johnson', 'Silva', 'Nakamura', 'Rodriguez', 'Smith'];
    var NATIONS = ['Россия', 'США', 'Бразилия', 'Франция', 'Япония', 'Великобритания', 'Нидерланды', 'Австралия'];

    // ============================================
    // НАВИГАЦИЯ
    // ============================================
    function showScreen(screenId) {
        var screens = document.querySelectorAll('.screen');
        for (var i = 0; i < screens.length; i++) {
            screens[i].classList.remove('active');
        }
        var screen = document.getElementById(screenId);
        if (screen) {
            screen.classList.add('active');
        }
    }

    function goToMainMenu() {
        GameState.mode = null;
        GameState.player = null;
        showScreen('main-menu');
        updateLoadSection();
    }

    // ============================================
    // СОХРАНЕНИЯ
    // ============================================
    function saveGame() {
        var key = 'promotion_sim_' + GameState.mode;
        var saveData = {
            mode: GameState.mode,
            player: GameState.player,
            promotions: GameState.promotions,
            fighters: GameState.fighters,
            currentDate: GameState.currentDate.toISOString(),
            events: GameState.events,
            timestamp: Date.now()
        };
        localStorage.setItem(key, JSON.stringify(saveData));
        GameState.saveSlots[key] = saveData;
        updateLoadSection();
    }

    function loadGame(mode) {
        var key = 'promotion_sim_' + mode;
        var data = localStorage.getItem(key);
        if (data) {
            var saveData = JSON.parse(data);
            GameState.mode = saveData.mode;
            GameState.player = saveData.player;
            GameState.promotions = saveData.promotions || [];
            GameState.fighters = saveData.fighters || [];
            GameState.currentDate = new Date(saveData.currentDate);
            GameState.events = saveData.events || [];
            return true;
        }
        return false;
    }

    function loadAllSaves() {
        var modes = ['career', 'promotion'];
        for (var i = 0; i < modes.length; i++) {
            var key = 'promotion_sim_' + modes[i];
            var data = localStorage.getItem(key);
            if (data) {
                GameState.saveSlots[key] = JSON.parse(data);
            }
        }
    }

    function updateLoadSection() {
        var loadSection = document.getElementById('load-section');
        var savesList = document.getElementById('saves-list');
        if (!loadSection || !savesList) return;

        var keys = Object.keys(GameState.saveSlots);
        if (keys.length > 0) {
            loadSection.style.display = 'block';
            var html = '';
            for (var i = 0; i < keys.length; i++) {
                var save = GameState.saveSlots[keys[i]];
                var modeName = save.mode === 'career' ? 'Карьера бойца' : 'Промоутер';
                var date = new Date(save.timestamp).toLocaleString('ru');
                var playerName = save.player ? (save.player.fullName || save.player.name || 'Неизвестно') : 'Неизвестно';
                html += '<div class="save-item" onclick="loadAndStartGame(\'' + save.mode + '\')">';
                html += '<strong>' + modeName + '</strong> - ' + playerName + '<br>';
                html += '<span style="color:#8892B0;font-size:14px;">Сохранено: ' + date + '</span>';
                html += '</div>';
            }
            savesList.innerHTML = html;
        } else {
            loadSection.style.display = 'none';
        }
    }

    function loadAndStartGame(mode) {
        if (loadGame(mode)) {
            if (mode === 'career') {
                showScreen('career-dashboard');
                updateFighterDashboard();
                showCareerTabContent('overview');
            } else {
                showScreen('promotion-dashboard');
                updatePromotionDashboard();
                showPromoterTabContent('overview');
            }
        }
    }

    // ============================================
    // ГЕНЕРАЦИЯ БОЙЦОВ
    // ============================================
    function generateFighter() {
        var firstName = FIRST_NAMES[randomInt(0, FIRST_NAMES.length - 1)];
        var lastName = LAST_NAMES[randomInt(0, LAST_NAMES.length - 1)];

        return {
            id: generateId(),
            firstName: firstName,
            lastName: lastName,
            fullName: firstName + ' ' + lastName,
            age: randomInt(18, 35),
            height: randomInt(160, 210),
            weight: randomInt(55, 120),
            nationality: NATIONS[randomInt(0, NATIONS.length - 1)],
            health: 100,
            energy: 100,
            stamina: randomInt(40, 90),
            strength: randomInt(40, 90),
            speed: randomInt(40, 90),
            striking: randomInt(40, 90),
            wrestling: randomInt(40, 90),
            grappling: randomInt(40, 90),
            defense: randomInt(40, 90),
            iq: randomInt(40, 90),
            experience: randomInt(0, 50),
            morale: randomInt(50, 100),
            popularity: randomInt(10, 80),
            discipline: randomInt(40, 90),
            records: {
                MMA: { wins: 0, losses: 0, draws: 0, ko: 0, submissions: 0, title: null, rank: 0 },
                BOXING: { wins: 0, losses: 0, draws: 0, ko: 0, title: null, rank: 0 },
                WRESTLING: { wins: 0, losses: 0, draws: 0, title: null, rank: 0 }
            },
            injuries: [],
            contracts: [],
            skinTone: '#F5D6C3',
            hairColor: '#1A1A1A',
            retired: false,
            retirementAge: randomInt(35, 45)
        };
    }

    function generateStartingFighters() {
        if (GameState.fighters.length > 0) return;
        for (var i = 0; i < 50; i++) {
            GameState.fighters.push(generateFighter());
        }
    }

    // ============================================
    // ГЕНЕРАЦИЯ ПРОМОУШНОВ
    // ============================================
    function generateStartingPromotions() {
        if (GameState.promotions.length > 0) return;

        var promoData = [
            { name: 'Ultimate Fight Association', country: 'Россия', budget: 5000000 },
            { name: 'Apex Fighting Championship', country: 'США', budget: 8000000 },
            { name: 'Rising Sun Combat League', country: 'Япония', budget: 3000000 },
            { name: 'Euro Fight Night', country: 'Франция', budget: 2000000 }
        ];

        for (var i = 0; i < promoData.length; i++) {
            var data = promoData[i];
            var promo = {
                id: generateId(),
                name: data.name,
                country: data.country,
                budget: data.budget,
                revenue: 0,
                expenses: 0,
                popularity: randomInt(30, 70),
                foundedDate: new Date(GameState.currentDate),
                roster: [],
                staff: [],
                events: [],
                colors: { primary: '#E31E24', secondary: '#1A1A1A' }
            };

            var fightersToAdd = randomInt(10, 20);
            var availableFighters = GameState.fighters.slice();
            for (var j = 0; j < fightersToAdd && availableFighters.length > 0; j++) {
                var idx = randomInt(0, availableFighters.length - 1);
                var fighter = availableFighters[idx];
                availableFighters.splice(idx, 1);

                var contract = {
                    fighterId: fighter.id,
                    promotionId: promo.id,
                    salary: randomInt(10000, 100000),
                    winBonus: randomInt(5000, 50000),
                    titleBonus: randomInt(10000, 100000),
                    duration: randomInt(12, 36),
                    fightsLeft: randomInt(3, 10),
                    signed: new Date(GameState.currentDate)
                };

                fighter.contracts.push(contract);
                promo.roster.push(fighter.id);
            }

            GameState.promotions.push(promo);
        }
    }

        // ============================================
        // ТРЕНИРОВКА И БОЙ
        // ============================================
        function trainAttribute(attr) {
            var fighter = GameState.player;
            if (!fighter) return;

            if (fighter.energy < 15) {
                alert('Недостаточно энергии! Отдохните.');
                return;
            }

            var gain = randomInt(1, 3);
            fighter[attr] = Math.min(100, fighter[attr] + gain);
            fighter.energy = Math.max(0, fighter.energy - 15);

            saveGame();
            updateFighterDashboard();
            showCareerTabContent('training');
            alert(attr.toUpperCase() + ' улучшен на ' + gain + '! Текущее значение: ' + fighter[attr]);
        }

        function simulateFight() {
            var fighter = GameState.player;
            if (!fighter) return;

            var opponent = null;
            for (var i = 0; i < GameState.fighters.length; i++) {
                if (GameState.fighters[i].id !== fighter.id && !GameState.fighters[i].retired) {
                    opponent = GameState.fighters[i];
                    break;
                }
            }

            if (!opponent) {
                alert('Нет доступных соперников!');
                return;
            }

            var fighterScore = fighter.striking + fighter.wrestling + fighter.defense + fighter.speed;
            var opponentScore = opponent.striking + opponent.wrestling + opponent.defense + opponent.speed;
            var total = fighterScore + opponentScore;
            var winChance = fighterScore / total;
            var roll = Math.random();
            var won = roll < winChance;

            fighter.energy = Math.max(0, fighter.energy - randomInt(15, 40));
            fighter.health = Math.max(0, fighter.health - randomInt(5, 20));
            fighter.experience += randomInt(1, 5);
            fighter.popularity = Math.max(0, Math.min(100, fighter.popularity + (won ? randomInt(1, 10) : randomInt(-5, 2))));
            fighter.morale = Math.max(0, Math.min(100, fighter.morale + (won ? randomInt(5, 15) : randomInt(-15, -5))));

            if (won) {
                fighter.records.MMA.wins++;
                if (Math.random() < 0.3) fighter.records.MMA.ko++;
                if (Math.random() < 0.2) fighter.records.MMA.submissions++;
            } else {
                fighter.records.MMA.losses++;
            }

            saveGame();
            updateFighterDashboard();
            showCareerTabContent('overview');

            alert((won ? '🏆 ПОБЕДА!' : '💔 ПОРАЖЕНИЕ...') + '\n\n' +
                fighter.fullName + ' ' + (won ? 'победил' : 'проиграл') + ' ' + opponent.fullName + '!\n\n' +
                '⚡ Энергия: ' + fighter.energy + '\n' +
                '❤️ Здоровье: ' + fighter.health + '\n' +
                '⭐ Популярность: ' + fighter.popularity);
        }

        function createNewEvent() {
            var promo = GameState.player;
            if (!promo) return;
            var eventName = prompt('Название ивента:', promo.name + ' Fight Night');
            if (!eventName) return;

            var newEvent = {
                id: generateId(),
                name: eventName,
                promotionId: promo.id,
                date: new Date(GameState.currentDate.getTime() + 30 * 24 * 60 * 60 * 1000),
                fights: [],
                venue: 'TBD',
                ticketSales: 0,
                revenue: 0
            };

            GameState.events.push(newEvent);
            if (!promo.events) promo.events = [];
            promo.events.push(newEvent.id);

            saveGame();
            showPromoterTabContent('events');
            alert('Ивент "' + eventName + '" создан!');
        }
