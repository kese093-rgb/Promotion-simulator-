<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promotion Simulator Online</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg: #FFFFFF; --bg2: #F5F5F5; --text: #1A1A1A; --text2: #666666;
            --border: #E0E0E0; --red: #CC0000; --blue: #1A73E8; --gold: #D4A017; --green: #0D8043;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter','Segoe UI',Arial,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; line-height:1.5; }
        .screen { display:none; }
        .screen.active { display:flex; flex-direction:column; min-height:100vh; }

        .menu-container { max-width:700px; margin:60px auto; padding:20px; text-align:center; }
        .logo { font-size:38px; font-weight:900; }
        .logo span { color:var(--red); }
        .subtitle { color:var(--text2); margin:10px 0 30px; font-size:15px; }

        .btn { padding:10px 18px; border:2px solid var(--border); border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; background:var(--bg); transition:all 0.15s; }
        .btn:hover { border-color:var(--text); }
        .btn-primary { background:var(--red); color:white; border-color:var(--red); }
        .btn-primary:hover { background:#aa0000; }
        .btn-blue { background:var(--blue); color:white; border-color:var(--blue); }
        .btn-blue:hover { background:#1557b0; }
        .btn-gold { background:var(--gold); color:white; border-color:var(--gold); }
        .btn-green { background:var(--green); color:white; border-color:var(--green); }
        .btn-danger { background:none; color:var(--red); border-color:var(--red); }
        .btn-danger:hover { background:#fff0f0; }
        .btn-large { width:100%; padding:14px; font-size:16px; margin-top:10px; }
        .btn-small { padding:6px 12px; font-size:12px; }
        .btn-back { background:none; border:none; color:var(--text2); padding:8px 0; cursor:pointer; font-size:14px; }
        .btn-back:hover { color:var(--text); }

        .creator-container { max-width:500px; margin:30px auto; padding:25px; background:var(--bg); border:2px solid var(--border); border-radius:12px; }
        .creator-container h2 { margin-bottom:15px; font-size:20px; }
        .form-group { margin-bottom:12px; }
        .form-group label { display:block; font-size:12px; font-weight:600; color:var(--text2); text-transform:uppercase; margin-bottom:4px; letter-spacing:0.5px; }
        .input, select { width:100%; padding:10px; border:2px solid var(--border); border-radius:8px; font-size:14px; background:var(--bg); color:var(--text); font-family:inherit; }
        .input:focus, select:focus { outline:none; border-color:var(--text); }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

        .dashboard { display:grid; grid-template-columns:220px 1fr 280px; min-height:100vh; }
        @media(max-width:1024px) { .dashboard { grid-template-columns:1fr; } .chat-panel { display:none; } .chat-panel.mobile-open { display:flex; position:fixed; bottom:0; left:0; right:0; height:50vh; z-index:100; } }
        .sidebar { background:var(--bg2); padding:15px; border-right:2px solid var(--border); overflow-y:auto; }
        .main-content { padding:20px; overflow-y:auto; }
        .chat-panel { background:var(--bg2); padding:15px; border-left:2px solid var(--border); display:flex; flex-direction:column; }

        .nav-btn { width:100%; padding:10px; text-align:left; background:none; border:none; font-size:13px; cursor:pointer; border-radius:6px; margin:2px 0; color:var(--text2); }
        .nav-btn:hover { background:var(--bg); color:var(--text); }
        .nav-btn.active { background:var(--text); color:white; }

        .card-mini { padding:12px; background:var(--bg); border-radius:8px; border:1px solid var(--border); margin-bottom:10px; text-align:center; font-size:13px; }

        .stat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; margin-top:10px; }
        .stat-card { padding:12px; background:var(--bg); border:1px solid var(--border); border-radius:8px; }
        .stat-card h3 { font-size:10px; color:var(--text2); text-transform:uppercase; letter-spacing:0.5px; }
        .stat-value { font-size:22px; font-weight:700; margin:4px 0; }
        .stat-bar { height:3px; background:var(--bg2); border-radius:2px; margin-top:4px; }
        .stat-bar-fill { height:100%; border-radius:2px; transition:width 0.3s; }
        .bar-energy { background:var(--blue); }
        .bar-prime { background:var(--gold); }
        .bar-hype { background:var(--red); }

        .data-table { width:100%; border-collapse:collapse; font-size:12px; }
        .data-table th { background:var(--bg2); padding:8px 10px; text-align:left; font-size:10px; text-transform:uppercase; color:var(--text2); letter-spacing:0.5px; border-bottom:2px solid var(--border); }
        .data-table td { padding:8px 10px; border-bottom:1px solid var(--border); }
        .data-table tr:hover td { background:var(--bg2); }

        .chat-messages { flex:1; overflow-y:auto; margin-bottom:10px; max-height:calc(100vh - 200px); }
        .chat-msg { padding:5px 0; border-bottom:1px solid var(--border); font-size:12px; line-height:1.4; }
        .chat-msg .name { font-weight:700; }
        .chat-msg .time { color:var(--text2); font-size:10px; }
        .chat-msg.system { color:var(--text2); font-style:italic; }
        .chat-input-area { display:flex; gap:5px; }
        .chat-input { flex:1; padding:8px; border:2px solid var(--border); border-radius:6px; font-size:13px; background:var(--bg); }

        .online-badge { display:inline-block; background:var(--green); color:white; padding:2px 8px; border-radius:10px; font-size:11px; }
        .badge { display:inline-block; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:600; }
        .badge-green { background:#e6f4ec; color:var(--green); }
        .badge-red { background:#fde8e8; color:var(--red); }
        .badge-blue { background:#e8f0fe; color:var(--blue); }

        .modal-overlay { position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000; }
        .modal { background:white; border-radius:12px; padding:20px; max-width:450px; width:90%; border:2px solid var(--border); }
        .modal h3 { margin-bottom:12px; }

        .fight-log { background:var(--bg2); border-radius:6px; padding:10px; margin:10px 0; max-height:250px; overflow-y:auto; font-size:13px; }
        .fight-log p { margin:5px 0; padding:3px 0; border-bottom:1px solid var(--border); }

        .notification { background:var(--bg2); border-left:3px solid var(--blue); padding:10px; margin:4px 0; border-radius:0 6px 6px 0; font-size:12px; cursor:pointer; }
        .notification.unread { border-left-color:var(--red); font-weight:600; }

        .toggle-chat-btn { display:none; position:fixed; bottom:10px; right:10px; z-index:200; background:var(--blue); color:white; }
        @media(max-width:1024px) { .toggle-chat-btn { display:block; } }
    </style>
</head>
<body>
    <div id="app">
        <!-- ГЛАВНОЕ МЕНЮ -->
<div id="menu" class="screen active">
    <div class="menu-container">
        <div class="logo">PROMOTION<span>SIM</span></div>
        <p class="subtitle">Онлайн симулятор <span id="online-count" class="online-badge">0 онлайн</span></p>
        
        <button class="btn btn-primary btn-large" onclick="showCreator('fighter')">👤 Создать бойца</button>
        <button class="btn btn-blue btn-large" style="margin-top:10px;" onclick="showCreator('promotion')">🏢 Создать промоушн</button>
        
        <div id="all-fighters-preview" style="margin-top:20px;text-align:left;"></div>
    </div>
</div>

<!-- СОЗДАНИЕ БОЙЦА -->
<div id="fighter-creator" class="screen">
    <div class="creator-container">
        <h2>👤 Создание бойца</h2>
        <div class="form-group"><label>Имя</label><input type="text" id="f-name" class="input" placeholder="Введите имя"></div>
        <div class="form-group"><label>Фамилия</label><input type="text" id="f-surname" class="input" placeholder="Введите фамилию"></div>
        <div class="form-row">
            <div class="form-group"><label>Возраст</label><select id="f-age" class="input"><option value="20">20 лет</option><option value="21">21 год</option><option value="22">22 года</option><option value="23">23 года</option></select></div>
            <div class="form-group"><label>Страна</label><select id="f-country" class="input"><option>Россия</option><option>Дагестан</option><option>Армения</option><option>Украина</option><option>Грузия</option><option>Абхазия</option><option>Испания</option><option>Франция</option><option>Германия</option><option>Бразилия</option><option>Англия</option><option>США</option></select></div>
        </div>
        <div class="form-group"><label>Базовый стиль</label><select id="f-style" class="input"><option value="boxing">🥊 Бокс</option><option value="kickboxing">🦵 Кикбоксинг</option><option value="wrestling">🤼 Борьба</option></select></div>
        <div id="preview-stats" style="background:var(--bg2);padding:12px;border-radius:8px;margin:12px 0;font-size:13px;"></div>
        <button class="btn btn-primary btn-large" onclick="createMyFighter()">✅ Создать бойца</button>
        <button class="btn btn-back" onclick="goToMenu()">← Назад</button>
    </div>
</div>

<!-- СОЗДАНИЕ ПРОМОУШНА -->
<div id="promotion-creator" class="screen">
    <div class="creator-container">
        <h2>🏢 Создание промоушна</h2>
        <div class="form-group"><label>Имя менеджера</label><input type="text" id="promo-manager-name" class="input" placeholder="Ваше имя"></div>
        <div class="form-group"><label>Название промоушна</label><input type="text" id="promo-name" class="input" placeholder="Например: Absolute FC"></div>
        <div class="form-group"><label>Вид спорта</label><select id="promo-sport" class="input"><option value="MMA">MMA</option><option value="BOXING">Бокс</option><option value="WRESTLING">Борьба</option></select></div>
        <div class="form-group"><label>Страна</label><select id="promo-country" class="input"><option>Россия</option><option>США</option><option>Бразилия</option><option>Франция</option><option>Япония</option></select></div>
        <button class="btn btn-blue btn-large" onclick="createMyPromotion()">✅ Создать промоушн</button>
        <button class="btn btn-back" onclick="goToMenu()">← Назад</button>
    </div>
</div>
            <!-- ДАШБОРД -->
    <div id="dashboard" class="screen">
        <div class="dashboard">
            <div class="sidebar">
                <div class="card-mini" id="player-card">
                    <div style="font-size:28px;">👤</div>
                    <strong id="sidebar-name">Игрок</strong>
                    <p style="font-size:11px;color:var(--text2);" id="sidebar-info"></p>
                </div>
                <nav id="sidebar-nav"></nav>
                <button class="btn btn-danger" onclick="logout()" style="width:100%;margin-top:auto;">🚪 Выйти</button>
                <button class="btn btn-back" onclick="goToMenu()" style="width:100%;">← В меню</button>
            </div>
            <div class="main-content" id="main-content">
                <h2>Добро пожаловать!</h2>
                <p style="color:var(--text2);">Выберите раздел в меню слева.</p>
                <div id="content-area"></div>
            </div>
            <div class="chat-panel" id="chat-panel">
                <h3 style="margin-bottom:10px;">💬 Чат <span id="chat-online" class="online-badge">0</span></h3>
                <div class="chat-messages" id="chat-messages">
                    <p style="color:var(--text2);">Загрузка сообщений...</p>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" class="chat-input" placeholder="Сообщение..." onkeypress="if(event.key==='Enter')sendChat()">
                    <button class="btn btn-blue btn-small" onclick="sendChat()">➤</button>
                </div>
            </div>
        </div>
    </div>
</div>
<button class="btn toggle-chat-btn" onclick="toggleChat()">💬 Чат</button>

<script>
    // ============================================
    // ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
    // ============================================
    var socket = null;
    var myPlayer = null;
    var myMode = null;
    var gameData = { fighters: [], promotions: [], messages: [], notifications: [], onlineCount: 0, events: [] };
    var currentTab = 'overview';
    var lastTrainTime = {};

    // ============================================
    // НАВИГАЦИЯ
    // ============================================
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
        var el = document.getElementById(id);
        if (el) el.classList.add('active');
    }

    function goToMenu() {
        myMode = null;
        showScreen('menu');
        renderAllFightersPreview();
    }

    function showCreator(type) {
        if (type === 'fighter') showScreen('fighter-creator');
        else showScreen('promotion-creator');
        if (type === 'fighter') updatePreviewStats();
    }

    function logout() {
        if (socket) socket.disconnect();
        socket = null;
        myPlayer = null;
        myMode = null;
        goToMenu();
    }

    function deleteMyCareer() {
        if (confirm('Удалить карьеру? Это нельзя отменить.')) {
            if (socket) socket.emit('deleteFighter', { playerId: myPlayer ? myPlayer.id : null });
            myMode = null;
            goToMenu();
        }
    }

    // ============================================
    // ПОДКЛЮЧЕНИЕ К СЕРВЕРУ
    // ============================================
    function connectToServer() {
        var name = document.getElementById('player-name').value.trim();
        if (!name) { alert('Введите имя!'); return; }
        myPlayer = { name: name, id: null };
        socket = io();

        socket.on('connect', function() {
            socket.emit('register', { name: name });
        });

        socket.on('registered', function(data) {
            myPlayer.id = data.id;
            document.getElementById('sidebar-name').textContent = name;
            document.getElementById('sidebar-info').textContent = 'Онлайн';
            buildSidebarNav();
            showScreen('dashboard');
            showTab('overview');
        });

        socket.on('serverState', function(data) {
            gameData.fighters = data.fighters || [];
            gameData.promotions = data.promotions || [];
            gameData.messages = data.messages || [];
            gameData.notifications = data.notifications || [];
            gameData.events = data.events || [];
            gameData.onlineCount = data.onlineCount || 0;
            updateOnlineCount();
            renderAllFightersPreview();
            renderChatMessages();
            updateMailBadge();
            if (document.getElementById('dashboard').classList.contains('active')) showTab(currentTab);
        });

        socket.on('playerJoined', function(data) {
            gameData.onlineCount = data.onlineCount;
            updateOnlineCount();
            addChatMessage({ from: 'Система', text: data.message, system: true, time: new Date().toISOString() });
        });

        socket.on('playerLeft', function(data) {
            gameData.onlineCount = data.onlineCount;
            updateOnlineCount();
            addChatMessage({ from: 'Система', text: data.message, system: true, time: new Date().toISOString() });
        });

        socket.on('newMessage', function(msg) { addChatMessage(msg); });

        socket.on('fighterCreated', function(fighter) {
            gameData.fighters.push(fighter);
            if (document.getElementById('dashboard').classList.contains('active') && (currentTab === 'allfighters' || currentTab === 'overview')) showTab(currentTab);
            renderAllFightersPreview();
        });

        socket.on('promotionCreated', function(promo) {
            gameData.promotions.push(promo);
            if (document.getElementById('dashboard').classList.contains('active') && currentTab === 'promotions') showTab('promotions');
        });

        socket.on('notification', function(notif) {
            gameData.notifications.unshift(notif);
            updateMailBadge();
        });

        socket.on('disconnect', function() {
            document.getElementById('sidebar-info').textContent = 'Отключено';
        });
    }

    function updateOnlineCount() {
        document.getElementById('online-count').textContent = gameData.onlineCount + ' онлайн';
        document.getElementById('chat-online').textContent = gameData.onlineCount;
    }

    // ============================================
    // ЧАТ
    // ============================================
    function sendChat() {
        var input = document.getElementById('chat-input');
        var text = input.value.trim();
        if (!text || !socket || !myPlayer) return;
        socket.emit('chatMessage', { name: myPlayer.name, text: text });
        input.value = '';
    }

    function addChatMessage(msg) {
        gameData.messages.push(msg);
        if (gameData.messages.length > 200) gameData.messages.shift();
        renderChatMessages();
    }

    function renderChatMessages() {
        var container = document.getElementById('chat-messages');
        if (!container) return;
        var html = '';
        var msgs = gameData.messages.slice(-30);
        for (var i = 0; i < msgs.length; i++) {
            var m = msgs[i];
            var time = new Date(m.time).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
            if (m.system) html += '<div class="chat-msg system">' + m.text + ' <span class="time">' + time + '</span></div>';
            else html += '<div class="chat-msg"><span class="name">' + m.from + ':</span> ' + m.text + ' <span class="time">' + time + '</span></div>';
        }
        container.innerHTML = html || '<p style="color:var(--text2);">Нет сообщений</p>';
        container.scrollTop = container.scrollHeight;
    }

    function toggleChat() {
        var panel = document.getElementById('chat-panel');
        if (panel) panel.classList.toggle('mobile-open');
    }

    // ============================================
    // УВЕДОМЛЕНИЯ (ПОЧТА)
    // ============================================
    function updateMailBadge() {
        var badge = document.getElementById('mail-badge');
        if (!badge) return;
        var unread = gameData.notifications.filter(function(n) { return !n.read; }).length;
        badge.style.display = unread > 0 ? 'inline' : 'none';
        badge.textContent = unread;
    }

    function renderMail() {
        var html = '<h2>📬 Почта</h2>';
        if (gameData.notifications.length === 0) {
            html += '<p style="color:var(--text2);">Нет уведомлений.</p>';
        } else {
            gameData.notifications.forEach(function(n, i) {
                html += '<div class="notification' + (n.read ? '' : ' unread') + '" onclick="markNotifRead(' + i + ')"><strong>' + new Date(n.time || n.createdAt).toLocaleString('ru') + '</strong><br>' + n.message + '</div>';
            });
        }
        return html;
    }

    function markNotifRead(index) {
        if (gameData.notifications[index]) gameData.notifications[index].read = true;
        updateMailBadge();
        showTab('mail');
    }
  // ============================================
// САЙДБАР
// ============================================
function buildSidebarNav() {
    var nav = document.getElementById('sidebar-nav');
    var html = '';
    html += '<button class="nav-btn active" onclick="showTab(\'overview\')">📊 Обзор</button>';
    html += '<button class="nav-btn" onclick="showTab(\'allfighters\')">👥 Все бойцы</button>';
    html += '<button class="nav-btn" onclick="showTab(\'promotions\')">🏢 Промоушны</button>';
    if (myMode === 'fighter') {
        html += '<button class="nav-btn" onclick="showTab(\'training\')">🏋️ Тренировки</button>';
        html += '<button class="nav-btn" onclick="showTab(\'fights\')">🥊 Бои</button>';
        html += '<button class="nav-btn" onclick="showTab(\'shop\')">🛒 Магазин</button>';
    }
    if (myMode === 'promoter') {
        html += '<button class="nav-btn" onclick="showTab(\'myroster\')">📋 Мой ростер</button>';
        html += '<button class="nav-btn" onclick="showTab(\'events\')">📅 Карды</button>';
        html += '<button class="nav-btn" onclick="showTab(\'finances\')">💰 Финансы</button>';
    }
    html += '<button class="nav-btn" onclick="showTab(\'mail\')">📬 Почта <span id="mail-badge" class="badge badge-red" style="display:none;">0</span></button>';
    nav.innerHTML = html;
}

function showTab(tab) {
    currentTab = tab;
    var nav = document.getElementById('sidebar-nav');
    if (nav) {
        nav.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
        var buttons = nav.querySelectorAll('.nav-btn');
        for (var i = 0; i < buttons.length; i++) {
            if (buttons[i].textContent.toLowerCase().includes(tab.toLowerCase())) buttons[i].classList.add('active');
        }
    }
    renderTabContent(tab);
}

// ============================================
// НАВЫКИ ПО СТИЛЮ
// ============================================
function getBaseStats(style, age) {
    var s = { boxing: 0, wrestling: 0, submission: 0, kick: 0, speed: 0, stamina: 0, strength: 0 };
    if (style === 'boxing') {
        if (age <= 23) { s.boxing = 6; s.wrestling = 1; s.submission = 1; s.kick = 1; s.speed = 6; s.stamina = 6; s.strength = 5; }
        else { s.boxing = 10; s.wrestling = 1; s.submission = 1; s.kick = 1; s.speed = 10; s.stamina = 10; s.strength = 5; }
    } else if (style === 'wrestling') {
        if (age <= 23) { s.boxing = 1; s.wrestling = 6; s.submission = 6; s.kick = 1; s.speed = 5; s.stamina = 6; s.strength = 6; }
        else { s.boxing = 1; s.wrestling = 10; s.submission = 10; s.kick = 1; s.speed = 5; s.stamina = 10; s.strength = 10; }
    } else if (style === 'kickboxing') {
        if (age <= 23) { s.boxing = 5; s.wrestling = 1; s.submission = 1; s.kick = 7; s.speed = 5; s.stamina = 5; s.strength = 5; }
        else { s.boxing = 6; s.wrestling = 1; s.submission = 1; s.kick = 10; s.speed = 10; s.stamina = 6; s.strength = 6; }
    }
    return s;
}

function updatePreviewStats() {
    var style = document.getElementById('f-style') ? document.getElementById('f-style').value : 'boxing';
    var age = parseInt(document.getElementById('f-age') ? document.getElementById('f-age').value : 20);
    var s = getBaseStats(style, age);
    var pv = document.getElementById('preview-stats');
    if (pv) pv.innerHTML = '<strong>Навыки:</strong> Бокс:' + s.boxing + ' Борьба:' + s.wrestling + ' Самбишн:' + s.submission + ' Удар ногой:' + s.kick + ' Скорость:' + s.speed + ' Выносливость:' + s.stamina + ' Сила:' + s.strength;
}

document.addEventListener('DOMContentLoaded', function() {
    var fs = document.getElementById('f-style');
    var fa = document.getElementById('f-age');
    if (fs) fs.addEventListener('change', updatePreviewStats);
    if (fa) fa.addEventListener('change', updatePreviewStats);
    updatePreviewStats();
});

// ============================================
// ============================================
// АВТОПОДКЛЮЧЕНИЕ К СЕРВЕРУ
// ============================================
function autoConnect(name) {
    myPlayer = { name: name, id: null };
    
    if (socket && socket.connected) {
        socket.emit('register', { name: name });
        return;
    }
    
    socket = io();
    
    socket.on('connect', function() {
        socket.emit('register', { name: name });
    });

    socket.on('registered', function(data) {
        myPlayer.id = data.id;
        document.getElementById('sidebar-name').textContent = name;
        document.getElementById('sidebar-info').textContent = 'Онлайн';
        buildSidebarNav();
        showScreen('dashboard');
        showTab('overview');
    });

    socket.on('serverState', function(data) {
        gameData.fighters = data.fighters || [];
        gameData.promotions = data.promotions || [];
        gameData.messages = data.messages || [];
        gameData.notifications = data.notifications || [];
        gameData.events = data.events || [];
        gameData.onlineCount = data.onlineCount || 0;
        updateOnlineCount();
        renderAllFightersPreview();
        renderChatMessages();
        updateMailBadge();
        if (document.getElementById('dashboard').classList.contains('active')) showTab(currentTab);
    });

    socket.on('playerJoined', function(data) {
        gameData.onlineCount = data.onlineCount;
        updateOnlineCount();
        addChatMessage({ from: 'Система', text: data.message, system: true, time: new Date().toISOString() });
    });

    socket.on('playerLeft', function(data) {
        gameData.onlineCount = data.onlineCount;
        updateOnlineCount();
        addChatMessage({ from: 'Система', text: data.message, system: true, time: new Date().toISOString() });
    });

    socket.on('newMessage', function(msg) { addChatMessage(msg); });

    socket.on('fighterCreated', function(fighter) {
        gameData.fighters.push(fighter);
        if (document.getElementById('dashboard').classList.contains('active')) showTab(currentTab);
        renderAllFightersPreview();
    });

    socket.on('promotionCreated', function(promo) {
        gameData.promotions.push(promo);
        if (document.getElementById('dashboard').classList.contains('active') && currentTab === 'promotions') showTab('promotions');
    });

    socket.on('notification', function(notif) {
        gameData.notifications.unshift(notif);
        updateMailBadge();
    });

    socket.on('disconnect', function() {
        document.getElementById('sidebar-info').textContent = 'Отключено';
    });
}

function renderTraining() {
    var f = findMyFighter();
    if (!f) return '<p style="color:var(--text2);">Создайте бойца!</p>';

    var skills = ['boxing','wrestling','submission','kick','speed','stamina','strength'];
    var names = ['Бокс','Борьба','Самбишн','Удар ногой','Скорость','Выносливость','Сила'];
    var html = '<h2>🏋️ Тренировки</h2><p style="color:var(--text2);">Энергия: ' + (f.energy || 100) + '/' + (f.maxEnergy || 100) + ' | Тренировка: -10 энергии | КД: 2 часа на навык</p><div class="stat-grid">';

    var now = Date.now();
    for (var i = 0; i < skills.length; i++) {
        var canTrain = (f.energy || 100) >= 10;
        var cdText = '';
        var key = f.id + '_' + skills[i];
        if (lastTrainTime[key] && (now - lastTrainTime[key]) < 7200000) {
            canTrain = false;
            cdText = '<br><span style="color:var(--red);font-size:10px;">Доступно через ' + Math.ceil((7200000 - (now - lastTrainTime[key])) / 60000) + ' мин</span>';
        }
        html += '<div class="stat-card"><h3>' + names[i] + '</h3><div class="stat-value">' + (f[skills[i]] || 0) + '</div>' + cdText + '<button class="btn btn-small" ' + (!canTrain ? 'disabled style="opacity:0.4;"' : '') + ' onclick="trainSkill(\'' + skills[i] + '\')">+1</button></div>';
    }
    html += '</div>';
    return html;
}

function trainSkill(skill) {
    var f = findMyFighter();
    if (!f || (f.energy || 100) < 10) return;
    var now = Date.now();
    var key = f.id + '_' + skill;
    if (lastTrainTime[key] && (now - lastTrainTime[key]) < 7200000) return;

    f[skill] = Math.min(100, (f[skill] || 0) + 1);
    f.energy = Math.max(0, (f.energy || 100) - 10);
    f.prime = Math.min(100, (f.prime || 0) + 1);
    lastTrainTime[key] = now;

    if (socket) socket.emit('updateFighter', f);
    showTab('training');
}

function startFight(oppId) {

}

function resolveFight(oppId, tactic) {
    var f = findMyFighter();
    var o = null;
    for (var i = 0; i < gameData.fighters.length; i++) { if (gameData.fighters[i].id === oppId) { o = gameData.fighters[i]; break; } }
    if (!f || !o) return null;

    var oppTactic = o.tactic || ['balance','box','wrestle'][Math.floor(Math.random() * 3)];
    var s1 = 0, s2 = 0;
    if (tactic === 'box') s1 = (f.boxing||0) * 2 + (f.speed||0) + (f.strength||0);
    else if (tactic === 'wrestle') s1 = (f.wrestling||0) * 2 + (f.strength||0) + (f.submission||0);
    else if (tactic === 'counter_box') s1 = (f.boxing||0) + (f.speed||0) + (f.submission||0) + 5;
    else if (tactic === 'counter_wrestle') s1 = (f.wrestling||0) + (f.strength||0) + (f.submission||0) + 5;
    else s1 = (f.boxing||0) + (f.wrestling||0) + (f.speed||0);

    if (oppTactic === 'box') s2 = (o.boxing||0) * 2 + (o.speed||0) + (o.strength||0);
    else if (oppTactic === 'wrestle') s2 = (o.wrestling||0) * 2 + (o.strength||0) + (o.submission||0);
    else if (oppTactic === 'counter_box') s2 = (o.boxing||0) + (o.speed||0) + (o.submission||0) + 5;
    else if (oppTactic === 'counter_wrestle') s2 = (o.wrestling||0) + (o.strength||0) + (o.submission||0) + 5;
    else s2 = (o.boxing||0) + (o.wrestling||0) + (o.speed||0);

    s1 += (f.prime||0)/10 + (f.hype||0)/20 + Math.floor(Math.random()*7) - 3;
    s2 += (o.prime||0)/10 + (o.hype||0)/20 + Math.floor(Math.random()*7) - 3;
    s1 *= (f.energy||100)/100;
    s2 *= (o.energy||100)/100;

    var commentary = ['🥊 ' + f.fullName + ' (' + tactic + ') vs ' + o.fullName + ' (' + oppTactic + ')'];
    var rounds = 5 + Math.floor(Math.random() * 4);
    for (var r = 0; r < rounds; r++) {
        var actor = Math.random() < (s1/(s1+s2)) ? f : o;
        var defender = actor.id === f.id ? o : f;
        var types = ['box','wrestle'];
        if ((actor.kick||0) > 5) types.push('kick');
        if ((actor.submission||0) > 5) types.push('submission');
        if (Math.random() < 0.3) types.push('defense');
        commentary.push(getCommentary(actor.fullName, defender.fullName, types[Math.floor(Math.random()*types.length)]));
    }

    var won = s1 > s2;
    var ko = Math.abs(s1-s2) > 15;
    if (ko && won) commentary.push('💥 НОКАУТ! ' + f.fullName + ' побеждает!');
    else if (ko && !won) commentary.push('💥 НОКАУТ! ' + o.fullName + ' побеждает!');
    else if (won) commentary.push('🏆 ' + f.fullName + ' побеждает решением судей!');
    else commentary.push('🏆 ' + o.fullName + ' побеждает решением судей!');

    return { winner: won ? f : o, loser: won ? o : f, ko: ko, commentary: commentary };
}

function watchFight(oppId) {
    var tactic = document.getElementById('fight-tactic').value;
    var result = resolveFight(oppId, tactic);
    if (!result) return;
    var area = document.getElementById('content-area');
    area.innerHTML = '<h2>🥊 Бой</h2><div class="fight-log" id="fight-log"></div>';
    var i = 0;
    function next() {
        if (i < result.commentary.length) {
            document.getElementById('fight-log').innerHTML += '<p>' + result.commentary[i] + '</p>';
            document.getElementById('fight-log').scrollTop = document.getElementById('fight-log').scrollHeight;
            i++;
            setTimeout(next, 2000);
        } else {
            applyFightResult(result);
            area.innerHTML += '<button class="btn btn-primary btn-large" onclick="showTab(\'fights\')">Продолжить</button>';
        }
    }
    setTimeout(next, 500);
}

function skipFight(oppId) {
    var tactic = document.getElementById('fight-tactic').value;
    var result = resolveFight(oppId, tactic);
    if (!result) return;
    applyFightResult(result);
    showTab('fights');
    alert(result.commentary[result.commentary.length - 1]);
}

function applyFightResult(result) {
    var w = result.winner;
    var l = result.loser;
    if (!w.records) w.records = { wins: 0, losses: 0, ko: 0 };
    if (!l.records) l.records = { wins: 0, losses: 0, ko: 0 };
    w.records.wins++;
    l.records.losses++;
    if (result.ko) w.records.ko = (w.records.ko || 0) + 1;
    w.energy = Math.max(0, (w.energy || 100) - 20);
    l.energy = Math.max(0, (l.energy || 100) - 35);
    w.prime = Math.min(100, (w.prime || 0) + 30);
    l.prime = Math.max(0, (l.prime || 0) - 30);
    w.hype = Math.min(100, (w.hype || 0) + (result.ko ? 15 : 10));
    w.coins = (w.coins || 0) + Math.floor(Math.random() * 150) + 50;
    l.coins = (l.coins || 0) + Math.floor(Math.random() * 30) + 10;
    if (socket) { socket.emit('updateFighter', w); socket.emit('updateFighter', l); }
  }

        // ============================================

        function renderMyRoster() {
            var p = findMyPromotion();
            if (!p) return '<p style="color:var(--text2);">Создайте промоушн!</p>';
            var html = '<h2>📋 Мой ростер</h2>';

            if (rosterFighters.length === 0) {
                html += '<p style="color:var(--text2);">Ростер пуст. Подпишите бойцов через вкладку "Все бойцы".</p>';

                rosterFighters.forEach(function(f) {
                    var rec = f.records || { wins: 0, losses: 0 };
                    html += '<tr><td><strong>' + f.fullName + '</strong></td><td>' + f.baseStyle + '</td><td>' + rec.wins + '-' + rec.losses + '</td><td>' + (f.hype || 0) + '</td></tr>';
                });

        // ============================================
        // ПРОМОУТЕР: КАРДЫ
        // ============================================
        function renderMyEvents() {
            var p = findMyPromotion();
            if (!p) return '<p style="color:var(--text2);">Создайте промоушн!</p>';
            var html = '<h2>📅 Карды</h2>';
            html += '<button class="btn btn-blue btn-large" onclick="createCard()">➕ Создать новый кард</button>';

            var myEvents = gameData.events.filter(function(e) { return e.promotionId === p.id; });
            if (myEvents.length > 0) {
                html += '<div class="stat-grid" style="margin-top:15px;">';
                myEvents.forEach(function(evt) {
                    var date = new Date(evt.date).toLocaleDateString('ru');
                    html += '<div class="stat-card"><h3>' + evt.name + '</h3><p style="font-size:11px;">📅 ' + date + '</p><p style="font-size:11px;">Бои: ' + (evt.fights ? evt.fights.length : 0) + '/3</p>';
                    if (evt.fights) {
                        evt.fights.forEach(function(fight, j) {
                            var f1 = gameData.fighters.find(function(ff) { return ff.id === fight.fighter1; });
                            var f2 = gameData.fighters.find(function(ff) { return ff.id === fight.fighter2; });
                            html += '<p style="font-size:10px;">' + (j === 0 ? '⭐ ' : '') + (f1 ? f1.fullName : '?') + ' vs ' + (f2 ? f2.fullName : '?') + '</p>';
                        });
                    }
                    html += '<button class="btn btn-small btn-green" onclick="addFightToCard(\'' + evt.id + '\')">+ Бой</button></div>';
                });
                html += '</div>';
            }
            return html;
        }

        function createCard() {
            if (!socket) return;
            var p = findMyPromotion();
            if (!p) return;
            var name = prompt('Название карда:', p.name + ' Fight Night');
            if (!name) return;
            var dateStr = prompt('Дата проведения (ДД.ММ.ГГГГ):', new Date(Date.now() + 14*86400000).toLocaleDateString('ru'));
            if (!dateStr) return;
            var parts = dateStr.split('.');
            var date = new Date(parseInt(parts[2]), parseInt(parts[1])-1, parseInt(parts[0]));
            socket.emit('createEvent', { name: name, promotionId: p.id, date: date.toISOString(), fights: [] });
            setTimeout(function() { showTab('events'); }, 300);
        }

        function addFightToCard(eventId) {
            var p = findMyPromotion();
            if (!p) return;
            var evt = gameData.events.find(function(e) { return e.id === eventId; });
            if (!evt || (evt.fights && evt.fights.length >= 3)) { alert('Максимум 3 боя на кард!'); return; }

            var rosterFighters = gameData.fighters.filter(function(f) { return p.roster && p.roster.indexOf(f.id) !== -1; });
            if (rosterFighters.length < 2) { alert('Нужно минимум 2 бойца в ростере!'); return; }

            var list = rosterFighters.map(function(f, i) { return (i+1) + '. ' + f.fullName; }).join('\n');
            var f1name = prompt('Боец 1:\n' + list);
            var f2name = prompt('Боец 2:\n' + list);
            var f1 = rosterFighters.find(function(f) { return f.fullName.toLowerCase() === (f1name || '').toLowerCase(); });
            var f2 = rosterFighters.find(function(f) { return f.fullName.toLowerCase() === (f2name || '').toLowerCase(); });
            if (!f1 || !f2 || f1.id === f2.id) { alert('Ошибка выбора!'); return; }

            var purse1 = parseInt(prompt('Гонорар ' + f1.fullName + ' (слабый: 50-100, средний: 100-250, сильный: 250-500):'));
            var purse2 = parseInt(prompt('Гонорар ' + f2.fullName + ':'));
            if (!purse1 || !purse2 || p.budget < (purse1+purse2)) { alert('Недостаточно средств!'); return; }

            p.budget -= (purse1+purse2);
            p.expenses = (p.expenses || 0) + (purse1+purse2);
            if (!evt.fights) evt.fights = [];
            evt.fights.push({ fighter1: f1.id, fighter2: f2.id, purse1: purse1, purse2: purse2, isMain: evt.fights.length === 0 });

            if (socket) {
                socket.emit('updateEvent', evt);
                socket.emit('updatePromotion', p);
            }
            showTab('events');
        }
