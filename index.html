<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMA Career</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --bg2: #1a1a1a;
            --text: #ffffff;
            --text2: #aaaaaa;
            --border: #333333;
            --red: #cc0000;
            --gold: #d4a017;
            --green: #00cc66;
            --blue: #0066ff;
            --card-bg: #1e1e1e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .screen { display: none; }
        .screen.active { display: flex; flex-direction: column; min-height: 100vh; }

        .menu-container {
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        .logo {
            font-size: 36px;
            font-weight: 900;
            color: var(--red);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(204, 0, 0, 0.3);
        }
        .logo span { color: var(--gold); }

        .subtitle {
            color: var(--text2);
            margin-bottom: 30px;
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            background: var(--bg2);
            color: var(--text);
            margin-bottom: 12px;
            text-align: center;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover { border-color: var(--gold); transform: scale(1.02); }

        .btn-primary { background: var(--red); color: white; border-color: var(--red); }
        .btn-primary:hover { background: #990000; border-color: #990000; }

        .btn-blue { background: var(--blue); color: white; border-color: var(--blue); }
        .btn-blue:hover { background: #0044cc; border-color: #0044cc; }

        .btn-green { background: var(--green); color: black; border-color: var(--green); }
        .btn-green:hover { background: #00994d; border-color: #00994d; }

        .btn-gold { background: var(--gold); color: black; border-color: var(--gold); }
        .btn-gold:hover { background: #b8860b; border-color: #b8860b; }

        .btn-danger { background: transparent; color: var(--red); border-color: var(--red); }
        .btn-danger:hover { background: var(--red); color: white; }

        .btn-back { background: #444; color: white; border-color: #444; }
        .btn-back:hover { background: #666; }

        .btn-small {
            display: inline-block;
            width: auto;
            padding: 8px 14px;
            font-size: 12px;
            margin-bottom: 0;
        }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .input, select {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            background: var(--bg2);
            color: var(--text);
        }
        .input:focus, select:focus { outline: none; border-color: var(--gold); }

        .dashboard { display: flex; min-height: 100vh; }
        .sidebar {
            width: 240px;
            background: var(--bg2);
            padding: 20px 15px;
            border-right: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .main-content { flex: 1; padding: 20px; overflow-y: auto; }

        .nav-btn {
            width: 100%;
            padding: 12px 14px;
            text-align: left;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text);
        }
        .nav-btn:hover { border-color: var(--gold); }
        .nav-btn.active { border-color: var(--gold); background: var(--gold); color: black; }

        .card-mini {
            padding: 15px;
            background: var(--bg);
            border-radius: 8px;
            border: 2px solid var(--border);
            text-align: center;
            margin-bottom: 10px;
        }

        .stat-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .stat-card {
            padding: 14px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 8px;
        }
        .stat-card.clickable { cursor: pointer; }
        .stat-card.clickable:hover { border-color: var(--gold); background: #1a1a1a; }

        .stat-card h3 {
            font-size: 11px;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stat-value { font-size: 24px; font-weight: 800; margin: 6px 0; }

        .stat-bar { height: 6px; background: var(--bg2); border-radius: 3px; margin-top: 6px; }
        .stat-bar-fill { height: 100%; border-radius: 3px; }
        .bar-energy { background: var(--blue); }
        .bar-prime { background: var(--gold); }
        .bar-hype { background: var(--red); }

        .save-slot {
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin: 8px 0;
            cursor: pointer;
            text-align: left;
            background: var(--bg);
        }
        .save-slot:hover { border-color: var(--gold); }

        .online-badge {
            display: inline-block;
            background: var(--green);
            color: black;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }

        .fight-log {
            background: var(--bg2);
            border-radius: 8px;
            padding: 16px;
            margin: 12px 0;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
            border: 2px solid var(--border);
        }
        .fight-log p {
            margin: 6px 0;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
        }
        .fight-log .highlight { color: var(--gold); font-weight: bold; }
        .fight-log .red { color: var(--red); font-weight: bold; }
        .fight-log .green { color: var(--green); font-weight: bold; }

        .notification {
            background: var(--gold);
            color: black;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: bold;
            border-left: 4px solid var(--red);
        }

        .score-card {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: var(--bg2);
            border-radius: 8px;
            border: 2px solid var(--gold);
            margin-top: 15px;
        }
        .score-card .fighter { font-weight: bold; font-size: 18px; }
        .score-card .score { font-size: 24px; color: var(--gold); }

        @media (max-width: 768px) {
            .dashboard { flex-direction: column; }
            .sidebar {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 6px;
                padding: 10px;
                border-right: none;
                border-bottom: 2px solid var(--border);
            }
            .nav-btn {
                width: auto;
                flex: 1;
                min-width: 80px;
                text-align: center;
                font-size: 12px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>
<!-- МЕНЮ -->
<div id="menu" class="screen active">
    <div class="menu-container">
        <div class="logo">MMA <span>Career</span></div>
        <p class="subtitle">Онлайн <span id="online-count" class="online-badge">0</span></p>
        
        <button class="btn btn-primary" id="btn-create-fighter" onclick="showScreen('fighter-form')">👤 Создать бойца</button>
        <button class="btn btn-gold" id="btn-create-promotion" onclick="showPromotionCodeForm()">🏆 Создать промоушн</button>
        <button class="btn btn-blue" onclick="showPromotionsList()">📋 Список промоушнов</button>
        
        <!-- КНОПКА ГЛОБАЛЬНОЙ ОЧИСТКИ (УДАЛИТЬ ПЕРЕД РЕЛИЗОМ) -->
        <button class="btn btn-danger" onclick="globalCleanup()" style="margin-top:20px;border-color:var(--red);background:var(--red);color:white;">💀 ГЛОБАЛЬНАЯ ОЧИСТКА</button>
        
        <div id="save-slots" style="margin-top:20px;"></div>
    </div>
</div>

<!-- ВВОД КОДА -->
<div id="promotion-code-form" class="screen">
    <div style="max-width:400px;margin:80px auto;padding:20px;">
        <h2 style="color:var(--gold);margin-bottom:20px;">🏆 Создание промоушна</h2>
        <p style="color:var(--text2);margin-bottom:15px;">Введите специальный код для создания промоушна. Код можно использовать только один раз.</p>
        <div class="form-group">
            <label>Код активации</label>
            <input type="password" id="promo-code-input" class="input" placeholder="Введите код" onkeydown="if(event.key==='Enter')checkPromotionCode()">
        </div>
        <button class="btn btn-gold" onclick="checkPromotionCode()">Активировать</button>
        <button class="btn btn-back" onclick="showScreen('menu')">← Назад</button>
    </div>
</div>

<!-- СОЗДАНИЕ ПРОМОУШНА -->
<div id="promotion-create-form" class="screen">
    <div style="max-width:500px;margin:30px auto;padding:20px;">
        <h2 style="color:var(--gold);margin-bottom:20px;">🏆 Создание промоушна</h2>
        <p style="color:var(--text2);margin-bottom:15px;">Автоматически создаются 3 дивизиона: Лёгкий, Средний, Тяжёлый.</p>
        <div class="form-group">
            <label>Название промоушна</label>
            <input type="text" id="promo-name" class="input" placeholder="Например: MMA World">
        </div>
        <div class="form-group">
            <label>Страна</label>
            <input type="text" id="promo-country" class="input" placeholder="Например: США">
        </div>
        <button class="btn btn-gold" onclick="createPromotion()">Создать промоушн</button>
        <button class="btn btn-back" onclick="showScreen('menu')">← Назад</button>
    </div>
</div>

<!-- СПИСОК ПРОМОУШНОВ -->
<div id="promotions-list" class="screen">
    <div style="max-width:800px;margin:30px auto;padding:20px;">
        <h2 style="color:var(--gold);margin-bottom:20px;">🏆 Промоушны</h2>
        <div id="promotions-grid" class="stat-grid"></div>
        <button class="btn btn-back" onclick="showScreen('menu')">← Назад</button>
    </div>
</div>

<!-- ДЕТАЛИ ПРОМОУШНА -->
<div id="promotion-detail" class="screen">
    <div style="max-width:900px;margin:30px auto;padding:20px;">
        <h2 id="promo-detail-title" style="color:var(--gold);margin-bottom:10px;"></h2>
        <p id="promo-detail-sport" style="color:var(--text2);margin-bottom:20px;"></p>
        <div id="promo-detail-actions" style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;"></div>
        <div id="promo-detail-content"></div>
        <button class="btn btn-back" onclick="showPromotionsList()">← Назад к списку</button>
    </div>
</div>

<!-- СОЗДАНИЕ БОЙЦА -->
<div id="fighter-form" class="screen">
    <div style="max-width:500px;margin:30px auto;padding:20px;">
        <h2 style="color:var(--red);margin-bottom:20px;">👤 Создание бойца</h2>
        <div class="form-group">
            <label>Имя</label>
            <input type="text" id="f-name" class="input" placeholder="Введите имя">
        </div>
        <div class="form-group">
            <label>Фамилия</label>
            <input type="text" id="f-surname" class="input" placeholder="Введите фамилию">
        </div>
        <div class="form-group">
            <label>Прозвище</label>
            <input type="text" id="f-nickname" class="input" placeholder="Необязательно">
        </div>
        <div class="form-group">
            <label>Возраст</label>
            <select id="f-age" class="input">
                <option value="20">20</option><option value="21">21</option><option value="22">22</option>
                <option value="23">23</option><option value="24">24</option>
            </select>
        </div>
        <div class="form-group">
            <label>Страна</label>
            <select id="f-country" class="input">
                <option>Россия</option><option>Дагестан</option><option>Армения</option>
                <option>Украина</option><option>Грузия</option><option>Абхазия</option>
                <option>Испания</option><option>Франция</option><option>Германия</option>
                <option>Бразилия</option><option>Англия</option><option>США</option>
            </select>
        </div>
        <div class="form-group">
            <label>Базовый стиль</label>
            <select id="f-style" class="input">
                <option value="boxing">Бокс</option>
                <option value="wrestling">Борьба</option>
                <option value="kickboxing">Кикбоксинг</option>
                <option value="muaythai">Муай-Тай</option>
                <option value="bjj">БЖЖ</option>
            </select>
        </div>
        <div class="form-group">
            <label>Весовая категория</label>
            <select id="f-division" class="input">
                <option value="Легкий">Легкий (до 70 кг)</option>
                <option value="Средний">Средний (до 84 кг)</option>
                <option value="Тяжелый">Тяжелый (до 120 кг)</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="createFighter()">Создать бойца</button>
        <button class="btn btn-back" onclick="showScreen('menu')">← Назад</button>
    </div>
              </div>
<!-- ДАШБОРД БОЙЦА -->
<div id="fighter-dashboard" class="screen">
    <div class="dashboard">
        <div class="sidebar">
            <div class="card-mini">
                <div style="font-size:32px;">👤</div>
                <div style="font-weight:bold;" id="dash-name"></div>
                <div style="color:var(--text2);font-size:12px;" id="dash-info"></div>
            </div>
            <button class="nav-btn active" onclick="showFighterTab('profile')">👤 Профиль</button>
            <button class="nav-btn" onclick="showFighterTab('promotions')">🏆 Мой промоушн</button>
            <button class="nav-btn" onclick="showFighterTab('upcoming')">📅 Бои</button>
            <button class="nav-btn btn-danger" onclick="deleteFighter()">🗑 Удалить бойца</button>
            <button class="nav-btn" onclick="showScreen('menu')" style="margin-top:auto;background:var(--red);color:white;">← В меню</button>
        </div>
        <div class="main-content" id="fighter-content"></div>
    </div>
</div>

<!-- ЭКРАН БОЯ -->
<div id="fight-screen" class="screen">
    <div style="max-width:900px;margin:30px auto;padding:20px;">
        <h2 style="color:var(--red);margin-bottom:10px;">⚔️ БОЙ</h2>
        <div id="fight-header" style="display:flex;justify-content:space-between;padding:15px;background:var(--bg2);border-radius:8px;margin-bottom:15px;border:2px solid var(--border);">
            <div id="fighter1-name" style="font-size:24px;font-weight:bold;"></div>
            <div style="font-size:24px;font-weight:bold;color:var(--gold);">VS</div>
            <div id="fighter2-name" style="font-size:24px;font-weight:bold;"></div>
        </div>
        <div id="fight-log" class="fight-log"></div>
        <div id="fight-score" style="margin-top:15px;"></div>
        <div id="fight-result" style="text-align:center;padding:20px;background:var(--bg2);border-radius:8px;border:2px solid var(--gold);margin-top:15px;display:none;">
            <h3 style="color:var(--gold);">🏆 РЕЗУЛЬТАТ БОЯ</h3>
            <p id="fight-result-text" style="font-size:20px;margin-top:10px;"></p>
            <p id="fight-final-score" style="font-size:18px;margin-top:5px;color:var(--text2);"></p>
        </div>
        <button class="btn btn-back" onclick="closeFightScreen()" style="margin-top:15px;">← Закрыть</button>
    </div>
</div>

<script>
// ============================================================
// 1. ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
// ============================================================
var socket = io();
var myPlayerId = null;
var myFighter = null;
var allFighters = [];
var allPromotions = [];
var currentPromotionId = null;
var currentFight = null;
var fightInterval = null;
var promotionCodeUsed = false;
var fightFinished = false;
var isFightActive = false;
const PROMO_CODE = '5656';

// ============================================================
// 2. ФУНКЦИИ СОХРАНЕНИЯ
// ============================================================
function saveAllData() {
    var dataToSave = {
        fighters: allFighters,
        promotions: allPromotions,
        myFighterId: myFighter ? myFighter.id : null,
        promotionCodeUsed: promotionCodeUsed
    };
    localStorage.setItem('mma_career_data', JSON.stringify(dataToSave));
    console.log('💾 Данные сохранены');
}

function loadAllData() {
    var saved = localStorage.getItem('mma_career_data');
    if (saved) {
        try {
            var data = JSON.parse(saved);
            allFighters = data.fighters || [];
            allPromotions = data.promotions || [];
            if (data.myFighterId) {
                var fighter = allFighters.find(function(f) { return f.id === data.myFighterId; });
                if (fighter) myFighter = fighter;
            }
            promotionCodeUsed = data.promotionCodeUsed || false;
            console.log('📂 Данные загружены. Бойцов:', allFighters.length);
            return true;
        } catch(e) { 
            console.log('❌ Ошибка загрузки данных:', e);
            return false; 
        }
    }
    return false;
}

function saveCurrentFighter() {
    if (myFighter) {
        var saved = localStorage.getItem('mma_career_data');
        if (saved) {
            try {
                var data = JSON.parse(saved);
                data.myFighterId = myFighter.id;
                localStorage.setItem('mma_career_data', JSON.stringify(data));
                console.log('💾 Текущий боец сохранен:', myFighter.fullName);
            } catch(e) {}
        }
    }
}

// ============================================================
// 3. SOCKET СОБЫТИЯ
// ============================================================
socket.on('serverState', function(data) {
    allFighters = data.fighters || [];
    allPromotions = data.promotions || [];
    
    document.getElementById('online-count').textContent = (data.onlineCount || 0) + ' онлайн';
    
    // Восстанавливаем бойца после перезагрузки
    loadAllData();
    
    // Проверяем, есть ли сохранённый боец в allFighters
    if (myFighter) {
        var exists = allFighters.some(function(f) { return f.id === myFighter.id; });
        if (exists) {
            var updatedFighter = allFighters.find(function(f) { return f.id === myFighter.id; });
            if (updatedFighter) {
                myFighter = updatedFighter;
                saveCurrentFighter();
            }
        } else {
            myFighter = null;
            localStorage.removeItem('mma_career_data');
        }
    }
    
    updateButtons();
    updateSaveSlots();
    saveAllData();
    
    if (!isFightActive) {
        checkForFight();
    }
});

socket.on('connect', function() {
    socket.emit('register', 'Игрок');
});

socket.on('registered', function(data) {
    myPlayerId = data.id;
    console.log('✅ ID получен:', myPlayerId);
});

socket.on('fighterCreated', function(f) {
    var exists = allFighters.some(function(x) { return x.id === f.id; });
    if (!exists) {
        allFighters.push(f);
        updateButtons();
        updateSaveSlots();
        saveAllData();
        console.log('👊 Боец создан:', f.fullName);
    }
});

socket.on('fighterUpdated', function(f) {
    var idx = allFighters.findIndex(function(x) { return x.id === f.id; });
    if (idx !== -1) {
        allFighters[idx] = f;
        if (myFighter && myFighter.id === f.id) myFighter = f;
    }
    saveAllData();
});

socket.on('promotionUpdated', function(p) {
    if (p.deleted) {
        allPromotions = allPromotions.filter(function(x) { return x.id !== p.id; });
        console.log('🗑 Промоушн удалён:', p.id);
    } else {
        var idx = allPromotions.findIndex(function(x) { return x.id === p.id; });
        if (idx !== -1) {
            allPromotions[idx] = p;
        } else {
            allPromotions.push(p);
            console.log('🏆 Создан промоушн:', p.name);
        }
    }
    saveAllData();
    updateSaveSlots();
});

socket.on('fightScheduled', function(data) {
    checkForFight();
    showNotification('⚔️ Бой назначен! Проверьте вкладку "Бои"');
});

socket.on('fightStarted', function(data) {
    if (!isFightActive) {
        currentFight = data;
        showFightScreen(data);
    }
});

socket.on('fightUpdate', function(data) {
    if (currentFight && currentFight.id === data.id) {
        updateFightLog(data.comment);
        if (data.roundScore) {
            updateScoreDisplay(data.roundScore);
        }
    }
});

socket.on('fightFinished', function(data) {
    if (currentFight && currentFight.id === data.id) {
        finishFight(data);
    }
});

socket.on('playerJoined', function(data) {
    document.getElementById('online-count').textContent = data.onlineCount + ' онлайн';
});

socket.on('playerLeft', function(data) {
    document.getElementById('online-count').textContent = data.onlineCount + ' онлайн';
});

// ============================================================
// 4. БАЗОВЫЕ ФУНКЦИИ
// ============================================================
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(function(s) {
        s.classList.remove('active');
    });
    document.getElementById(id).classList.add('active');
}

function updateButtons() {
    var hasFighter = allFighters.some(function(f) {
        return f.ownerId === myPlayerId && !f.isBot;
    });
    var btnF = document.getElementById('btn-create-fighter');
    if (btnF) btnF.style.display = hasFighter ? 'none' : 'block';
}

function updateSaveSlots() {
    var container = document.getElementById('save-slots');
    if (!container) return;
    var html = '<h3 style="color:var(--gold);margin-bottom:10px;">💾 Мои бойцы</h3>';
    
    var myFighters = allFighters.filter(function(f) {
        return f.ownerId === myPlayerId && !f.isBot;
    });
    
    if (myFighters.length > 0) {
        myFighters.forEach(function(f) {
            var promoName = 'Без промоушна';
            if (f.currentPromotionId) {
                var promo = allPromotions.find(function(p) { return p.id === f.currentPromotionId; });
                if (promo) promoName = promo.name;
            }
            var isActive = myFighter && myFighter.id === f.id;
            html += '<div class="save-slot" onclick="loadFighter(\'' + f.id + '\')" style="' + (isActive ? 'border-color:var(--gold);border-width:3px;' : '') + '">' +
                '<strong>👤 ' + f.fullName + (isActive ? ' ⭐' : '') + '</strong><br>' +
                '<span style="color:var(--text2);font-size:12px;">' + f.country + ' | ' + f.division + ' | ' + promoName + '</span>' +
                '</div>';
        });
    } else {
        html += '<div class="save-slot" style="color:#999;">👤 Нет бойцов</div>';
    }
    container.innerHTML = html;
}

function loadFighter(fighterId) {
    if (!fighterId) {
        var myFighters = allFighters.filter(function(f) { return f.ownerId === myPlayerId && !f.isBot; });
        if (myFighters.length > 0) {
            fighterId = myFighters[0].id;
        } else {
            alert('Нет бойцов!');
            return;
        }
    }
    
    var fighter = allFighters.find(function(f) { return f.id === fighterId; });
    if (!fighter) return;
    
    myFighter = fighter;
    saveCurrentFighter();
    document.getElementById('dash-name').textContent = myFighter.fullName;
    document.getElementById('dash-info').textContent = myFighter.country + ' | ' + myFighter.division + ' | ' + myFighter.baseStyle;
    showScreen('fighter-dashboard');
    showFighterTab('profile');
    updateSaveSlots();
}

function deleteFighter() {
    if (!confirm('Удалить бойца?')) return;
    if (myFighter && socket) socket.emit('deleteFighter', { playerId: myPlayerId });
    myFighter = null;
    updateButtons();
    showScreen('menu');
    saveAllData();
}

function showNotification(message) {
    var container = document.getElementById('save-slots');
    if (container) {
        var notif = document.createElement('div');
        notif.className = 'notification';
        notif.textContent = message;
        container.parentNode.insertBefore(notif, container);
        setTimeout(function() {
            if (notif.parentNode) notif.remove();
        }, 10000);
    }
    alert(message);
}

function showPromotionDetail(promoId) {
    currentPromotionId = promoId;
    showScreen('promotion-detail');
    renderPromotionDetail(promoId);
}

function renderPromotionDetail(promoId) {
    var promo = allPromotions.find(function(p) { return p.id === promoId; });
    if (!promo) return;

    document.getElementById('promo-detail-title').textContent = '🏆 ' + promo.name;
    document.getElementById('promo-detail-sport').textContent = promo.country + ' | Владелец: ' + (promo.ownerId === myPlayerId ? 'Вы' : 'Другой игрок');

    var actionsDiv = document.getElementById('promo-detail-actions');
    var isInPromo = myFighter && myFighter.currentPromotionId === promoId;
    var isOwner = promo.ownerId === myPlayerId;
    var hasFighter = myFighter !== null;

    var actionsHtml = '';
    
    if (hasFighter && !isInPromo) {
        actionsHtml += '<button class="btn btn-green btn-small" onclick="joinPromotion(\'' + promoId + '\')">📝 Вступить</button>';
    } else if (isInPromo) {
        actionsHtml += '<button class="btn btn-danger btn-small" onclick="leavePromotion(\'' + promoId + '\')">🚪 Покинуть</button>';
    }
    
    if (isOwner) {
        actionsHtml += '<button class="btn btn-gold btn-small" onclick="showAddFightForm(\'' + promoId + '\')">⚔️ Добавить бой</button>';
        actionsHtml += '<button class="btn btn-danger btn-small" onclick="deletePromotionCompletely(\'' + promoId + '\')">🗑 Удалить промоушн</button>';
    }
    
    actionsHtml += '<button class="btn btn-blue btn-small" onclick="showPromotionRanking(\'' + promoId + '\')">🏆 Рейтинг</button>';
    
    actionsDiv.innerHTML = actionsHtml;
    showPromotionRanking(promoId);
}

function joinPromotion(promoId) {
    if (!myFighter) { alert('Сначала создайте бойца!'); return; }
    var promo = allPromotions.find(function(p) { return p.id === promoId; });
    if (!promo) return;
    
    if (promo.divisions.indexOf(myFighter.division) === -1) {
        alert('Ваш дивизион (' + myFighter.division + ') не подходит для этого промоушна. Доступны: ' + promo.divisions.join(', '));
        return;
    }
    
    myFighter.currentPromotionId = promoId;
    socket.emit('updateFighter', myFighter);
    
    if (!promo.roster) promo.roster = [];
    if (promo.roster.indexOf(myFighter.id) === -1) {
        promo.roster.push(myFighter.id);
        socket.emit('updatePromotion', promo);
    }
    
    saveAllData();
    renderPromotionDetail(promoId);
    updateSaveSlots();
    alert('✅ ' + myFighter.fullName + ' вступил в ' + promo.name + '!');
}

function leavePromotion(promoId) {
    if (!myFighter) return;
    var promo = allPromotions.find(function(p) { return p.id === promoId; });
    if (!promo) return;
    
    if (promo.roster) {
        var idx = promo.roster.indexOf(myFighter.id);
        if (idx !== -1) {
            promo.roster.splice(idx, 1);
            socket.emit('updatePromotion', promo);
        }
    }
    
    myFighter.currentPromotionId = null;
    socket.emit('updateFighter', myFighter);
    saveAllData();
    renderPromotionDetail(promoId);
    updateSaveSlots();
    alert('Вы покинули ' + promo.name);
}

function deletePromotionCompletely(promoId) {
    var promo = allPromotions.find(function(p) { return p.id === promoId; });
    if (!promo) {
        alert('Промоушн не найден!');
        return;
    }
    
    if (promo.ownerId !== myPlayerId) {
        alert('❌ Только владелец может удалить промоушн!');
        return;
    }
    
    if (!confirm('🗑 Удалить промоушн "' + promo.name + '" и всех бойцов из него?')) return;
    
    if (promo.roster) {
        for (var i = 0; i < promo.roster.length; i++) {
            var fighter = allFighters.find(function(f) { return f.id === promo.roster[i]; });
            if (fighter) {
                fighter.currentPromotionId = null;
                socket.emit('updateFighter', fighter);
            }
        }
    }
    
    allPromotions = allPromotions.filter(function(p) { return p.id !== promoId; });
    socket.emit('updatePromotion', { id: promoId, deleted: true });
    saveAllData();
    showPromotionsList();
    alert('✅ Промоушн удалён!');
}

function showPromotionRanking(promoId) {
    var promo = allPromotions.find(function(p) { return p.id === promoId; });
    if (!promo) return;

    var container = document.getElementById('promo-detail-content');
    var isOwner = promo.ownerId === myPlayerId;
    
    var html = '<h3 style="margin-bottom:15px;">🏆 Рейтинг по дивизионам</h3>';
    
    for (var d = 0; d < promo.divisions.length; d++) {
        var division = promo.divisions[d];
        var rosterFighters = allFighters.filter(function(f) {
            return f.currentPromotionId === promoId && f.division === division;
        });
        
        rosterFighters.sort(function(a, b) {
            return (b.hype || 0) - (a.hype || 0);
        });
        
        html += '<h4 style="color:var(--gold);margin-top:15px;">📋 ' + division + ' дивизион (Топ-15)</h4>';
        html += '<div class="stat-grid">';
        
        if (rosterFighters.length === 0) {
            html += '<p style="color:var(--text2);">Нет бойцов в этом дивизионе</p>';
        } else {
            var topCount = Math.min(15, rosterFighters.length);
            for (var i = 0; i < topCount; i++) {
                var f = rosterFighters[i];
                var isMyFighter = myFighter && myFighter.id === f.id;
                var rank = i + 1;
                var medal = '';
                if (rank === 1) medal = '🥇 ';
                else if (rank === 2) medal = '🥈 ';
                else if (rank === 3) medal = '🥉 ';

                html += '<div class="stat-card" style="' + (isMyFighter ? 'border-color:var(--gold);border-width:3px;' : '') + '">';
                html += '<h3>' + medal + '#' + rank + ' ' + f.fullName + (isMyFighter ? ' ⭐ (Вы)' : '') + '</h3>';
                html += '<p>' + f.baseStyle + ' | Рекорд: ' + (f.records ? f.records.wins + '-' + f.records.losses + '-' + f.records.ko + 'KO' : '0-0-0') + '</p>';
                html += '<p style="font-size:12px;color:var(--text2);">Хайп: ' + (f.hype || 0) + ' | Прайм: ' + (f.prime || 0) + '</p>';
                
                if (isOwner && !isMyFighter) {
                    html += '<button class="btn btn-danger btn-small" onclick="removeFighterFromPromotion(\'' + promoId + '\', \'' + f.id + '\')" style="margin-top:5px;">🗑 Удалить</button>';
                }
                
                html += '</div>';
            }
        }
        html += '</div>';
    }
    
    container.innerHTML = html;
}

function removeFighterFromPromotion(promoId, fighterId) {
    var promo = allPromotions.find(function(p) { return p.id === promoId; });
    if (!promo) return;
    
    if (promo.ownerId !== myPlayerId) {
        alert('❌ Только владелец промоушна может удалять бойцов!');
        return;
    }
    
    if (!confirm('Удалить бойца из промоушна?')) return;
    
    if (promo.roster) {
        var idx = promo.roster.indexOf(fighterId);
        if (idx !== -1) {
            promo.roster.splice(idx, 1);
        }
    }
    
    var fighter = allFighters.find(function(f) { return f.id === fighterId; });
    if (fighter) {
        fighter.currentPromotionId = null;
        socket.emit('updateFighter', fighter);
    }
    
    socket.emit('updatePromotion', promo);
    saveAllData();
    renderPromotionDetail(promoId);
    alert('✅ Боец удалён из промоушна!');
}

function showAddFightForm(promoId) {
    var promo = allPromotions.find(function(p) { return p.id === promoId; });
    if (!promo) return;
    
    if (promo.fights && promo.fights.some(function(f) { return f.status === 'scheduled' || f.status === 'in_progress'; })) {
        alert('❌ В этом промоушне уже есть запланированные или активные бои. Дождитесь их завершения.');
        return;
    }
    
    var divisionOptions = '';
    for (var i = 0; i < promo.divisions.length; i++) {
        divisionOptions += (i+1) + '. ' + promo.divisions[i] + '\n';
    }
    var divChoice = prompt('Выберите дивизион для боя:\n' + divisionOptions);
    if (!divChoice) return;
    
    var divIdx = parseInt(divChoice) - 1;
    if (isNaN(divIdx) || divIdx < 0 || divIdx >= promo.divisions.length) {
        alert('Неверный выбор дивизиона!');
        return;
    }
    var selectedDivision = promo.divisions[divIdx];
    
    var rosterFighters = allFighters.filter(function(f) {
        return f.currentPromotionId === promoId && f.division === selectedDivision;
    });
    
    if (rosterFighters.length < 2) {
        alert('В дивизионе ' + selectedDivision + ' минимум 2 бойца!');
        return;
    }
    
    var fighterList = '';
    for (var j = 0; j < rosterFighters.length; j++) {
        fighterList += (j+1) + '. ' + rosterFighters[j].fullName + ' (' + rosterFighters[j].records.wins + '-' + rosterFighters[j].records.losses + ')\n';
    }
    
    var fight1 = prompt('Выберите первого бойца (введите номер):\n' + fighterList);
    if (!fight1) return;
    var fight2 = prompt('Выберите второго бойца (введите номер):\n' + fighterList);
    if (!fight2) return;
    
    var idx1 = parseInt(fight1) - 1;
    var idx2 = parseInt(fight2) - 1;
    
    if (isNaN(idx1) || isNaN(idx2) || idx1 === idx2 || idx1 < 0 || idx2 < 0 || idx1 >= rosterFighters.length || idx2 >= rosterFighters.length) {
        alert('Неверный выбор!');
        return;
    }
    
    var fighter1 = rosterFighters[idx1];
    var fighter2 = rosterFighters[idx2];
    
    var dateStr = prompt('Введите дату и время боя (например: 2026-08-25 20:00):');
    if (!dateStr) return;
    var fightTime = new Date(dateStr);
    if (isNaN(fightTime.getTime())) {
        alert('Неверный формат даты! Используйте: ГГГГ-ММ-ДД ЧЧ:ММ');
        return;
    }
    
    var fight = {
        id: 'fight_' + Date.now(),
        promotionId: promoId,
        fighter1Id: fighter1.id,
        fighter2Id: fighter2.id,
        fighter1Name: fighter1.fullName,
        fighter2Name: fighter2.fullName,
        division: selectedDivision,
        scheduledTime: fightTime.toISOString(),
        status: 'scheduled',
        comments: [],
        roundScores: [],
        totalAttacks: { fighter1: 0, fighter2: 0 },
        roundAttacks: { fighter1: 0, fighter2: 0 },
        currentRound: 0,
        result: null,
        createdBy: myPlayerId
    };
    
    if (!promo.fights) promo.fights = [];
    promo.fights.push(fight);
    socket.emit('updatePromotion', promo);
    saveAllData();
    
    alert('✅ Бой добавлен в кард на ' + fightTime.toLocaleString() + '!');
    renderPromotionDetail(promoId);
    
    socket.emit('fightScheduled', { promotionId: promoId, fight: fight });
  }

// 9. СИСТЕМА БОЁВ
// ============================================================
function checkForFight() {
    if (isFightActive) return;
    
    var now = new Date();
    for (var i = 0; i < allPromotions.length; i++) {
        var promo = allPromotions[i];
        if (promo.fights) {
            for (var j = 0; j < promo.fights.length; j++) {
                var fight = promo.fights[j];
                if (fight.status === 'scheduled') {
                    var fightTime = new Date(fight.scheduledTime);
                    if (fightTime <= now) {
                        startFight(fight);
                        return;
                    }
                }
            }
        }
    }
}

function startFight(fight) {
    if (isFightActive) return;
    isFightActive = true;
    fightFinished = false;
    
    fight.status = 'in_progress';
    fight.comments = [];
    fight.roundScores = [];
    fight.totalAttacks = { fighter1: 0, fighter2: 0 };
    fight.currentRound = 1;
    fight.roundAttacks = { fighter1: 0, fighter2: 0 };
    
    socket.emit('updatePromotion', allPromotions.find(function(p) { return p.id === fight.promotionId; }));
    
    currentFight = fight;
    showFightScreen(fight);
    socket.emit('fightStarted', fight);
    
    var f1 = fight.fighter1Name;
    var f2 = fight.fighter2Name;
    
    var allComments = [];
    var allAttacks = { fighter1: 0, fighter2: 0 };
    
    for (var round = 1; round <= 3; round++) {
        var roundComments = [];
        var f1Attacks = 0;
        var f2Attacks = 0;
        
        for (var m = 0; m < 5; m++) {
            var comment = generateFightComment(f1, f2, round, m);
            var attacker = Math.random() > 0.5 ? 'fighter1' : 'fighter2';
            if (attacker === 'fighter1') {
                f1Attacks++;
                allAttacks.fighter1++;
            } else {
                f2Attacks++;
                allAttacks.fighter2++;
            }
            roundComments.push({ text: comment, attacker: attacker });
        }
        
        var roundScore = calculateRoundScore(f1Attacks, f2Attacks);
        fight.roundScores.push(roundScore);
        
        allComments.push({ text: '🔴 РАУНД ' + round + ' НАЧАЛСЯ!', attacker: null });
        for (var c = 0; c < roundComments.length; c++) {
            allComments.push(roundComments[c]);
        }
        allComments.push({ 
            text: '📊 Счёт ' + round + ' раунда: ' + roundScore.fighter1 + '-' + roundScore.fighter2 + ' (' + f1Attacks + '-' + f2Attacks + ' успешных атак)',
            attacker: null,
            isScore: true,
            roundScore: roundScore
        });
    }
    
    var totalScore1 = 0;
    var totalScore2 = 0;
    for (var s = 0; s < fight.roundScores.length; s++) {
        totalScore1 += fight.roundScores[s].fighter1;
        totalScore2 += fight.roundScores[s].fighter2;
    }
    
    var winner = totalScore1 > totalScore2 ? fight.fighter1Id : (totalScore2 > totalScore1 ? fight.fighter2Id : null);
    
    allComments.push({ text: '🏆 БОЙ ЗАВЕРШЁН!', attacker: null, isFinal: true });
    if (winner === fight.fighter1Id) {
        allComments.push({ text: '🥇 Победитель: ' + f1 + '! Общий счёт ' + totalScore1 + '-' + totalScore2, attacker: null, isFinal: true });
    } else if (winner === fight.fighter2Id) {
        allComments.push({ text: '🥇 Победитель: ' + f2 + '! Общий счёт ' + totalScore1 + '-' + totalScore2, attacker: null, isFinal: true });
    } else {
        allComments.push({ text: '🤝 Ничья! Общий счёт ' + totalScore1 + '-' + totalScore2, attacker: null, isFinal: true });
    }
    
    fight.result = {
        winnerId: winner,
        totalScore: { fighter1: totalScore1, fighter2: totalScore2 },
        roundScores: fight.roundScores,
        totalAttacks: allAttacks
    };
    
    var commentIndex = 0;
    
    fightInterval = setInterval(function() {
        if (commentIndex < allComments.length) {
            var item = allComments[commentIndex];
            if (item.attacker === 'fighter1') {
                fight.totalAttacks.fighter1++;
            } else if (item.attacker === 'fighter2') {
                fight.totalAttacks.fighter2++;
            }
            
            fight.comments.push(item.text);
            updateFightLog(item.text);
            
            if (item.roundScore) {
                updateScoreDisplay(item.roundScore);
            }
            
            socket.emit('fightUpdate', { 
                id: fight.id, 
                comment: item.text,
                roundScore: item.roundScore || null
            });
            commentIndex++;
        } else {
            clearInterval(fightInterval);
            finishFight(fight);
        }
    }, 2000);
}

function calculateRoundScore(f1Attacks, f2Attacks) {
    var diff = f1Attacks - f2Attacks;
    var f1Score = 10;
    var f2Score = 10;
    
    if (diff >= 3) {
        f1Score = 10;
        f2Score = 7;
    } else if (diff === 2) {
        f1Score = 10;
        f2Score = 8;
    } else if (diff === 1) {
        f1Score = 10;
        f2Score = 9;
    } else if (diff === -1) {
        f1Score = 9;
        f2Score = 10;
    } else if (diff === -2) {
        f1Score = 8;
        f2Score = 10;
    } else if (diff <= -3) {
        f1Score = 7;
        f2Score = 10;
    }
    
    return { fighter1: f1Score, fighter2: f2Score };
}

function showFightScreen(fight) {
    showScreen('fight-screen');
    document.getElementById('fighter1-name').textContent = fight.fighter1Name;
    document.getElementById('fighter2-name').textContent = fight.fighter2Name;
    document.getElementById('fight-log').innerHTML = '';
    document.getElementById('fight-result').style.display = 'none';
    document.getElementById('fight-score').innerHTML = '';
    document.getElementById('fight-header').style.borderColor = 'var(--gold)';
    fightFinished = false;
}

function updateFightLog(comment) {
    var log = document.getElementById('fight-log');
    var p = document.createElement('p');
    p.textContent = comment;
    if (comment.includes('🏆') || comment.includes('🥇')) {
        p.style.color = 'var(--gold)';
        p.style.fontWeight = 'bold';
        p.style.fontSize = '18px';
    } else if (comment.includes('🔴')) {
        p.style.color = 'var(--red)';
        p.style.fontWeight = 'bold';
        p.style.fontSize = '16px';
    } else if (comment.includes('📊')) {
        p.style.color = 'var(--blue)';
        p.style.fontWeight = 'bold';
    }
    log.appendChild(p);
    log.scrollTop = log.scrollHeight;
}

function updateScoreDisplay(roundScore) {
    var scoreDiv = document.getElementById('fight-score');
    var html = '<div class="score-card">' +
        '<div class="fighter">' + currentFight.fighter1Name + '</div>' +
        '<div class="score">' + roundScore.fighter1 + ' - ' + roundScore.fighter2 + '</div>' +
        '<div class="fighter">' + currentFight.fighter2Name + '</div>' +
        '</div>';
    scoreDiv.innerHTML = html;
}

function finishFight(fight) {
    if (fightFinished) return;
    fightFinished = true;
    isFightActive = false;
    
    clearInterval(fightInterval);
    fight.status = 'finished';
    
    var f1 = allFighters.find(function(f) { return f.id === fight.fighter1Id; });
    var f2 = allFighters.find(function(f) { return f.id === fight.fighter2Id; });
    
    if (f1 && f2) {
        var winnerId = fight.result.winnerId;
        if (winnerId === f1.id) {
            f1.records.wins++;
            f1.records.ko = (f1.records.ko || 0) + (Math.random() > 0.5 ? 1 : 0);
            f2.records.losses++;
        } else if (winnerId === f2.id) {
            f2.records.wins++;
            f2.records.ko = (f2.records.ko || 0) + (Math.random() > 0.5 ? 1 : 0);
            f1.records.losses++;
        }
        socket.emit('updateFighter', f1);
        socket.emit('updateFighter', f2);
    }
    
    socket.emit('updatePromotion', allPromotions.find(function(p) { return p.id === fight.promotionId; }));
    saveAllData();
    
    document.getElementById('fight-result').style.display = 'block';
    var winnerName = fight.result.winnerId === f1.id ? f1.fullName : (fight.result.winnerId === f2.id ? f2.fullName : 'Ничья');
    document.getElementById('fight-result-text').textContent = '🏆 Победитель: ' + winnerName + '!';
    document.getElementById('fight-final-score').textContent = 'Общий счёт: ' + fight.result.totalScore.fighter1 + ' - ' + fight.result.totalScore.fighter2;
    document.getElementById('fight-header').style.borderColor = 'var(--gold)';
    
    socket.emit('fightFinished', fight);
}

function closeFightScreen() {
    clearInterval(fightInterval);
    fightInterval = null;
    currentFight = null;
    isFightActive = false;
    fightFinished = false;
    showScreen('fighter-dashboard');
    showFighterTab('profile');
}

// ============================================================
// 10. ГЛОБАЛЬНАЯ ОЧИСТКА (УДАЛЯЕТ ВСЁ У ВСЕХ)
// ============================================================
function globalCleanup() {
    if (!confirm('💀 ЭТО УДАЛИТ ВСЕХ БОЙЦОВ И ВСЕ ПРОМОУШНЫ У ВСЕХ ИГРОКОВ! Продолжить?')) return;
    if (!confirm('ТОЧНО? Это действие НЕЛЬЗЯ ОТМЕНИТЬ!')) return;
    if (!confirm('ПОСЛЕДНЕЕ ПРЕДУПРЕЖДЕНИЕ! Все данные будут удалены НАВСЕГДА!')) return;
    
    // Удаляем всех бойцов
    var allFighterIds = allFighters.map(function(f) { return f.id; });
    for (var i = 0; i < allFighterIds.length; i++) {
        socket.emit('deleteFighter', { playerId: allFighterIds[i] });
    }
    allFighters = [];
    
    // Удаляем все промоушны
    for (var j = 0; j < allPromotions.length; j++) {
        var p = allPromotions[j];
        socket.emit('updatePromotion', { id: p.id, deleted: true });
    }
    allPromotions = [];
    
    // Очищаем localStorage
    localStorage.removeItem('mma_career_data');
    localStorage.removeItem('ps_game_data');
    
    // Сбрасываем всё
    myFighter = null;
    currentFight = null;
    isFightActive = false;
    fightFinished = false;
    promotionCodeUsed = false;
    
    // Обновляем интерфейс
    updateSaveSlots();
    updateButtons();
    showScreen('menu');
    
    alert('💀 ВСЁ УДАЛЕНО! Все бойцы и промоушны у всех игроков удалены.');
    
    // Перезагружаем страницу для полной очистки
    location.reload();
}

function showFighterTab(tab) {
    var navBtns = document.querySelectorAll('#fighter-dashboard .nav-btn');
    for (var i = 0; i < navBtns.length; i++) {
        navBtns[i].classList.remove('active');
    }
    if (event && event.target) {
        event.target.classList.add('active');
    }

    var c = document.getElementById('fighter-content');
    var f = myFighter;

    if (!f) {
        c.innerHTML = '<p style="color:var(--text2);">Боец не найден. Создайте бойца в меню.</p>';
        return;
    }

    if (tab === 'profile') {
        var promoName = 'Без промоушна';
        if (f.currentPromotionId) {
            var promo = allPromotions.find(function(p) { return p.id === f.currentPromotionId; });
            if (promo) promoName = promo.name;
        }

        c.innerHTML = '<h2>👤 ' + f.fullName + (f.nickname ? ' "' + f.nickname + '"' : '') + '</h2>' +
            '<p style="color:var(--text2);margin-bottom:15px;">' + f.country + ' | ' + f.division + ' | ' + f.baseStyle + ' | ' + promoName + '</p>' +
            '<div class="stat-grid">' +
            '<div class="stat-card"><h3>⚡ Энергия</h3><div class="stat-value">' + f.energy + '/' + f.maxEnergy + '</div><div class="stat-bar"><div class="stat-bar-fill bar-energy" style="width:' + (f.energy / f.maxEnergy * 100) + '%"></div></div></div>' +
            '<div class="stat-card"><h3>🔥 Прайм</h3><div class="stat-value">' + f.prime + '/' + f.maxPrime + '</div><div class="stat-bar"><div class="stat-bar-fill bar-prime" style="width:' + (f.prime / f.maxPrime * 100) + '%"></div></div></div>' +
            '<div class="stat-card"><h3>📢 Хайп</h3><div class="stat-value">' + f.hype + '/' + f.maxHype + '</div><div class="stat-bar"><div class="stat-bar-fill bar-hype" style="width:' + (f.hype / f.maxHype * 100) + '%"></div></div></div>' +
            '<div class="stat-card"><h3>🏆 Рекорд</h3><div class="stat-value" style="font-size:20px;">' + f.records.wins + 'W-' + f.records.losses + 'L-' + f.records.ko + 'KO</div></div>' +
            '</div>' +
            '<h3 style="margin-top:15px;">Навыки</h3><div class="stat-grid">' +
            '<div class="stat-card"><h3>Бокс</h3><div class="stat-value">' + f.boxing + '</div></div>' +
            '<div class="stat-card"><h3>Борьба</h3><div class="stat-value">' + f.wrestling + '</div></div>' +
            '<div class="stat-card"><h3>Самбишн</h3><div class="stat-value">' + f.submission + '</div></div>' +
            '<div class="stat-card"><h3>Удар ногой</h3><div class="stat-value">' + f.kick + '</div></div>' +
            '<div class="stat-card"><h3>Скорость</h3><div class="stat-value">' + f.speed + '</div></div>' +
            '<div class="stat-card"><h3>Выносливость</h3><div class="stat-value">' + f.stamina + '</div></div>' +
            '<div class="stat-card"><h3>Сила</h3><div class="stat-value">' + f.strength + '</div></div>' +
            '</div>';
            
    } else if (tab === 'promotions') {
        if (f.currentPromotionId) {
            var promo = allPromotions.find(function(p) { return p.id === f.currentPromotionId; });
            if (promo) {
                c.innerHTML = '<h2>🏆 Мой промоушн: ' + promo.name + '</h2>' +
                    '<p>' + promo.country + ' | Дивизионы: ' + promo.divisions.join(', ') + '</p>' +
                    '<button class="btn btn-primary" onclick="showPromotionDetail(\'' + promo.id + '\')" style="margin-top:15px;">📋 Перейти в промоушн</button>';
            } else {
                c.innerHTML = '<h2>🏆 Мой промоушн</h2><p style="color:var(--text2);">Промоушн не найден</p>';
            }
        } else {
            c.innerHTML = '<h2>🏆 Мой промоушн</h2><p style="color:var(--text2);">Вы не состоите ни в одном промоушне</p>' +
                '<button class="btn btn-blue" onclick="showPromotionsList()" style="margin-top:15px;">📋 Смотреть промоушны</button>';
        }
        
    } else if (tab === 'upcoming') {
        var upcomingFights = [];
        for (var i = 0; i < allPromotions.length; i++) {
            var promo = allPromotions[i];
            if (promo.fights) {
                for (var j = 0; j < promo.fights.length; j++) {
                    var fight = promo.fights[j];
                    if ((fight.status === 'scheduled' || fight.status === 'in_progress') && 
                        (fight.fighter1Id === f.id || fight.fighter2Id === f.id)) {
                        upcomingFights.push(fight);
                    }
                }
            }
        }
        
        if (upcomingFights.length === 0) {
            c.innerHTML = '<h2>📅 Предстоящие бои</h2><p style="color:var(--text2);">У вас нет назначенных боёв</p>';
        } else {
            var html = '<h2>📅 Предстоящие бои</h2>';
            for (var k = 0; k < upcomingFights.length; k++) {
                var uf = upcomingFights[k];
                var time = new Date(uf.scheduledTime);
                var opponent = uf.fighter1Id === f.id ? uf.fighter2Name : uf.fighter1Name;
                var statusText = uf.status === 'scheduled' ? '⏳ Ожидание' : '⚔️ В ПРОЦЕССЕ!';
                html += '<div class="stat-card" style="border-color:' + (uf.status === 'in_progress' ? 'var(--red)' : 'var(--gold)') + ';">' +
                    '<h3>⚔️ ' + f.fullName + ' VS ' + opponent + '</h3>' +
                    '<p>Дивизион: ' + uf.division + '</p>' +
                    '<p style="color:' + (uf.status === 'in_progress' ? 'var(--red)' : 'var(--gold)') + ';font-weight:bold;">' + statusText + '</p>' +
                    '<p style="color:var(--text2);">🕐 ' + time.toLocaleString() + '</p>' +
                    '</div>';
            }
            c.innerHTML = html;
        }
    }
}
