<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Promotion Simulator Online</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- ГЛАВНОЕ МЕНЮ -->
        <div id="menu" class="screen active">
            <div class="menu-container">
                <div class="logo">PROMOTION<span>SIM</span></div>
                <p class="subtitle">Онлайн симулятор <span id="online-count" class="online-badge">0 онлайн</span></p>
                <button class="btn btn-primary btn-large" onclick="showCreator('fighter')">👤 Создать бойца</button>
                <button class="btn btn-blue btn-large" style="margin-top:10px;" onclick="showCreator('promotion')">🏢 Создать промоушн</button>
                <div id="all-fighters-preview" style="margin-top:20px;text-align:left;"></div>
                <div id="save-slots-info" style="margin-top:15px;"></div>
            </div>
        </div>

        <!-- СОЗДАНИЕ БОЙЦА -->
        <div id="fighter-creator" class="screen">
            <div class="creator-container">
                <h2>👤 Создание бойца</h2>
                <div class="form-group"><label>Имя</label><input type="text" id="f-name" class="input" placeholder="Введите имя"></div>
                <div class="form-group"><label>Фамилия</label><input type="text" id="f-surname" class="input" placeholder="Введите фамилию"></div>
                <div class="form-row">
                    <div class="form-group"><label>Возраст</label><select id="f-age" class="input"><option value="20">20 лет</option><option value="21">21 год</option><option value="22">22 года</option><option value="23">23 года</option></select></div>
                    <div class="form-group"><label>Страна</label><select id="f-country" class="input"><option>Россия</option><option>Дагестан</option><option>Армения</option><option>Украина</option><option>Грузия</option><option>Абхазия</option><option>Испания</option><option>Франция</option><option>Германия</option><option>Бразилия</option><option>Англия</option><option>США</option></select></div>
                </div>
                <div class="form-group"><label>Базовый стиль</label><select id="f-style" class="input"><option value="boxing">🥊 Бокс</option><option value="kickboxing">🦵 Кикбоксинг</option><option value="wrestling">🤼 Борьба</option></select></div>
                <div id="preview-stats" style="background:var(--bg2);padding:12px;border-radius:8px;margin:12px 0;font-size:0.85rem;"></div>
                <button class="btn btn-primary btn-large" onclick="createMyFighter()">✅ Создать бойца</button>
                <button class="btn btn-back" onclick="goToMenu()">← Назад</button>
            </div>
        </div>

        <!-- СОЗДАНИЕ ПРОМОУШНА -->
        <div id="promotion-creator" class="screen">
            <div class="creator-container">
                <h2>🏢 Создание промоушна</h2>
                <div class="form-group"><label>Имя менеджера</label><input type="text" id="promo-manager-name" class="input" placeholder="Ваше имя"></div>
                <div class="form-group"><label>Название промоушна</label><input type="text" id="promo-name" class="input" placeholder="Например: Absolute FC"></div>
                <div class="form-group"><label>Вид спорта</label><select id="promo-sport" class="input"><option value="MMA">MMA</option><option value="BOXING">Бокс</option><option value="WRESTLING">Борьба</option></select></div>
                <div class="form-group"><label>Страна</label><select id="promo-country" class="input"><option>Россия</option><option>США</option><option>Бразилия</option><option>Франция</option><option>Япония</option></select></div>
                <button class="btn btn-blue btn-large" onclick="createMyPromotion()">✅ Создать промоушн</button>
                <button class="btn btn-back" onclick="goToMenu()">← Назад</button>
            </div>
        </div>

        <!-- ДАШБОРД -->
        <div id="dashboard" class="screen">
            <div class="dashboard">
                <div class="sidebar">
                    <div class="card-mini" id="player-card">
                        <div style="font-size:1.8rem;">👤</div>
                        <strong id="sidebar-name">Игрок</strong>
                        <p style="font-size:0.7rem;color:var(--text2);" id="sidebar-info">Не в сети</p>
                    </div>
                    <nav id="sidebar-nav"></nav>
                    <button class="btn btn-danger" onclick="logout()" style="width:100%;margin-top:auto;">🚪 Выйти</button>
                    <button class="btn btn-back" onclick="goToMenu()" style="width:100%;">← В меню</button>
                </div>
                <div class="main-content" id="main-content">
                    <h2>Добро пожаловать!</h2>
                    <p style="color:var(--text2);">Выберите раздел в меню слева.</p>
                    <div id="content-area"></div>
                </div>
                <div class="chat-panel" id="chat-panel">
                    <h3 style="margin-bottom:0.6rem;">💬 Чат <span id="chat-online" class="online-badge">0</span></h3>
                    <div class="chat-messages" id="chat-messages">
                        <p style="color:var(--text2);">Загрузка сообщений...</p>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="chat-input" class="chat-input" placeholder="Сообщение..." onkeypress="if(event.key==='Enter')sendChat()">
                        <button class="btn btn-blue btn-small" onclick="sendChat()">➤</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <button class="btn toggle-chat-btn" onclick="toggleChat()">💬 Чат</button>

    <!-- Скрипты в правильном порядке -->
    <script src="js/chat.js"></script>
    <script src="js/fighter.js"></script>
    <script src="js/promoter.js"></script>
    <script src="js/socket.js"></script>
</body>
    </html>
