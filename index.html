<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promotion Simulator</title>
    <style>
        body {
            background: #FFFFFF;
            color: #1A1A1A;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
        }
        .logo {
            font-size: 42px;
            font-weight: 900;
            color: #CC0000;
            margin-bottom: 40px;
        }
        .btn {
            display: block;
            width: 300px;
            margin: 15px auto;
            background: #CC0000;
            color: #FFFFFF;
            border: none;
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 10px;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        .form-group { margin: 15px 0; text-align: left; max-width: 400px; margin-left: auto; margin-right: auto; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #CC0000; border-radius: 8px; }
        .nav-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            background: #FFFFFF;
            border: 2px solid #CC0000;
            color: #CC0000;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            text-align: left;
        }
        .nav-btn:hover { background: #CC0000; color: white; }
        .nav-btn.active { background: #CC0000; color: white; }
    </style>
</head>
<body>
    <!-- МЕНЮ -->
    <div id="menu" class="screen active">
        <div class="logo">PROMOTION SIM</div>
        <button class="btn" onclick="showScreen('fighter-form')">👤 Создать бойца</button>
        <button class="btn" onclick="showScreen('promoter-form')">🏢 Создать промоушн</button>
    </div>

    <!-- СОЗДАНИЕ БОЙЦА -->
    <div id="fighter-form" class="screen">
        <h2 style="color:#CC0000;">Создание бойца</h2>
        <div class="form-group"><label>Имя</label><input type="text" id="f-name" placeholder="Введите имя"></div>
        <div class="form-group"><label>Фамилия</label><input type="text" id="f-surname" placeholder="Введите фамилию"></div>
        <div class="form-group"><label>Прозвище</label><input type="text" id="f-nickname" placeholder="Прозвище (необязательно)"></div>
        <div class="form-group"><label>Возраст</label><select id="f-age"><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option></select></div>
        <div class="form-group"><label>Страна</label><select id="f-country"><option>Россия</option><option>Дагестан</option><option>Армения</option><option>Украина</option><option>Грузия</option><option>Абхазия</option><option>Испания</option><option>Франция</option><option>Германия</option><option>Бразилия</option><option>Англия</option><option>США</option></select></div>
        <div class="form-group"><label>Базовый стиль</label><select id="f-style"><option value="boxing">Бокс</option><option value="wrestling">Борьба</option><option value="kickboxing">Кикбоксинг</option></select></div>
        <button class="btn" onclick="createFighter()">Создать бойца</button>
        <button class="btn" style="background:#666;" onclick="showScreen('menu')">← Назад</button>
    </div>

    <!-- СОЗДАНИЕ ПРОМОУШНА -->
    <div id="promoter-form" class="screen">
        <h2 style="color:#CC0000;">Создание промоушна</h2>
        <div class="form-group"><label>Имя менеджера</label><input type="text" id="p-manager" placeholder="Ваше имя"></div>
        <div class="form-group"><label>Название промоушна</label><input type="text" id="p-name" placeholder="Название"></div>
        <div class="form-group"><label>Вид спорта</label><select id="p-sport"><option value="MMA">MMA</option><option value="BOXING">Бокс</option><option value="WRESTLING">Борьба</option><option value="BAREKNUCKLE">Кулачный бой</option></select></div>
        <div class="form-group"><label>Страна</label><select id="p-country"><option>Россия</option><option>США</option><option>Бразилия</option><option>Франция</option><option>Япония</option></select></div>
        <button class="btn" onclick="createPromotion()">Создать промоушн</button>
        <button class="btn" style="background:#666;" onclick="showScreen('menu')">← Назад</button>
    </div>

    <!-- ДАШБОРД БОЙЦА -->
    <div id="fighter-dashboard" class="screen">
        <div style="display:flex; min-height:100vh;">
            <div style="width:220px; background:#F5F5F5; padding:15px; border-right:2px solid #CC0000;">
                <div style="text-align:center; margin-bottom:20px;">
                    <div style="font-size:40px;">👤</div>
                    <div style="font-weight:bold; font-size:18px;" id="dash-name"></div>
                    <div style="color:#666; font-size:13px;" id="dash-info"></div>
                </div>
                <button class="nav-btn active" onclick="showFighterTab('profile')">👤 Профиль</button>
                <button class="nav-btn" onclick="showFighterTab('training')">🏋️ Тренировки</button>
                <button class="nav-btn" onclick="showFighterTab('promotions')">🏢 Промоушны</button>
                <button class="nav-btn" onclick="showFighterTab('upcoming')">📅 Предстоящие бои</button>
                <button class="nav-btn" onclick="showScreen('menu')" style="margin-top:20px;background:#CC0000;color:white;">← В меню</button>
            </div>
            <div style="flex:1; padding:20px;" id="fighter-content"></div>
        </div>
    </div>

    <!-- ДАШБОРД ПРОМОУШНА -->
    <div id="promoter-dashboard" class="screen">
        <div style="display:flex; min-height:100vh;">
            <div style="width:220px; background:#F5F5F5; padding:15px; border-right:2px solid #CC0000;">
                <div style="text-align:center; margin-bottom:20px;">
                    <div style="font-size:40px;">🏢</div>
                    <div style="font-weight:bold; font-size:18px;" id="promo-dash-name"></div>
                    <div style="color:#666; font-size:13px;" id="promo-dash-sport"></div>
                </div>
                <button class="nav-btn active" onclick="showPromoterTab('profile')">👤 Профиль</button>
                <button class="nav-btn" onclick="showPromoterTab('ranking')">🏆 Рейтинг</button>
                <button class="nav-btn" onclick="showPromoterTab('cards')">📅 Карды</button>
                <button class="nav-btn" onclick="showPromoterTab('freefighters')">👥 Свободные бойцы</button>
                <button class="nav-btn" onclick="showScreen('menu')" style="margin-top:20px;background:#CC0000;color:white;">← В меню</button>
            </div>
            <div style="flex:1; padding:20px;" id="promoter-content"></div>
        </div>
    </div>

    <script>
        var myFighter = null;
        var myPromotion = null;
        var allFighters = [];
        var allPromotions = [];

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function createFighter() {
            var name = document.getElementById('f-name').value || 'Боец';
            var surname = document.getElementById('f-surname').value || 'Новый';
            var nickname = document.getElementById('f-nickname').value;
            var age = document.getElementById('f-age').value;
            var country = document.getElementById('f-country').value;
            var style = document.getElementById('f-style').value;
            myFighter = {
                id: 'f_' + Date.now(), firstName: name, lastName: surname, fullName: name + ' ' + surname,
                nickname: nickname, age: parseInt(age), country: country, baseStyle: style,
                boxing: 5, wrestling: 5, submission: 5, kick: 5, speed: 5, stamina: 5, strength: 5,
                energy: 100, maxEnergy: 100, prime: 0, maxPrime: 100, hype: 0, maxHype: 100,
                records: { wins: 0, losses: 0, ko: 0 }, currentPromotionId: null
            };
            allFighters.push(myFighter);
            document.getElementById('dash-name').textContent = myFighter.fullName;
            document.getElementById('dash-info').textContent = myFighter.country + ' | ' + myFighter.baseStyle;
            showScreen('fighter-dashboard');
            showFighterTab('profile');
        }

        function createPromotion() {
            var manager = document.getElementById('p-manager').value || 'Менеджер';
            var name = document.getElementById('p-name').value || 'Новый промоушн';
            var sport = document.getElementById('p-sport').value;
            var country = document.getElementById('p-country').value;
            myPromotion = {
                id: 'p_' + Date.now(), name: name, manager: manager, sport: sport, country: country,
                popularity: 30, roster: [], events: []
            };
            allPromotions.push(myPromotion);
            document.getElementById('promo-dash-name').textContent = myPromotion.name;
            document.getElementById('promo-dash-sport').textContent = myPromotion.sport + ' | ' + myPromotion.country;
            showScreen('promoter-dashboard');
            showPromoterTab('profile');
        }

        function showFighterTab(tab) {
            document.querySelectorAll('#fighter-dashboard .nav-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            var c = document.getElementById('fighter-content');
            var f = myFighter;
            if (tab === 'profile') {
                c.innerHTML = '<h2>👤 ' + f.fullName + (f.nickname ? ' "' + f.nickname + '"' : '') + '</h2>' +
                    '<p><strong>Страна:</strong> ' + f.country + ' | <strong>Возраст:</strong> ' + f.age + ' | <strong>Стиль:</strong> ' + f.baseStyle + '</p>' +
                    '<p><strong>Энергия:</strong> ' + f.energy + '/' + f.maxEnergy + ' | <strong>Прайм:</strong> ' + f.prime + '/' + f.maxPrime + ' | <strong>Хайп:</strong> ' + f.hype + '/' + f.maxHype + '</p>' +
                    '<p><strong>Рекорд:</strong> ' + f.records.wins + 'W-' + f.records.losses + 'L-' + f.records.ko + 'KO</p>' +
                    '<h3>Навыки</h3>' +
                    '<p>Бокс: ' + f.boxing + ' | Борьба: ' + f.wrestling + ' | Самбишн: ' + f.submission + ' | Удар ногой: ' + f.kick + '</p>' +
                    '<p>Скорость: ' + f.speed + ' | Выносливость: ' + f.stamina + ' | Сила: ' + f.strength + '</p>';
            } else if (tab === 'training') { c.innerHTML = '<h2>🏋️ Тренировки</h2><p>В разработке</p>'; }
            else if (tab === 'promotions') {
                var sorted = allPromotions.slice().sort(function(a, b) { return b.popularity - a.popularity; });
                var h = '<h2>🏆 Рейтинг промоушнов</h2><ol>';
                for (var i = 0; i < sorted.length; i++) { h += '<li><strong>' + sorted[i].name + '</strong> — ' + sorted[i].popularity + '% (' + sorted[i].sport + ')</li>'; }
                h += '</ol>'; c.innerHTML = h;
            } else if (tab === 'upcoming') { c.innerHTML = '<h2>📅 Предстоящие бои</h2><p>Нет боёв</p>'; }
        }

        function showPromoterTab(tab) {
            document.querySelectorAll('#promoter-dashboard .nav-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            var c = document.getElementById('promoter-content');
            var p = myPromotion;
            if (tab === 'profile') {
                c.innerHTML = '<h2>👤 ' + p.name + '</h2>' +
                    '<p><strong>Менеджер:</strong> ' + p.manager + ' | <strong>Спорт:</strong> ' + p.sport + ' | <strong>Страна:</strong> ' + p.country + '</p>' +
                    '<p><strong>Популярность:</strong> ' + p.popularity + '% | <strong>Бойцов:</strong> ' + p.roster.length + ' | <strong>Кардов:</strong> ' + p.events.length + '</p>';
            } else if (tab === 'ranking') {
                var sorted = allPromotions.slice().sort(function(a, b) { return b.popularity - a.popularity; });
                var h = '<h2>🏆 Рейтинг промоушнов</h2><ol>';
                for (var i = 0; i < sorted.length; i++) { h += '<li><strong>' + sorted[i].name + '</strong> — ' + sorted[i].popularity + '% (' + sorted[i].sport + ')</li>'; }
                h += '</ol>'; c.innerHTML = h;
            } else if (tab === 'cards') {
                var h = '<h2>📅 Карды</h2><button class="btn" onclick="createCard()" style="width:auto;">➕ Создать кард</button>';
                if (p.events.length === 0) { h += '<p>Нет кардов</p>'; }
                else { for (var i = 0; i < p.events.length; i++) { var evt = p.events[i]; h += '<div style="border:2px solid #CC0000; border-radius:10px; padding:10px; margin:10px 0;"><strong>' + evt.name + '</strong> — ' + new Date(evt.date).toLocaleDateString('ru') + '<p>Бои: ' + evt.fights.length + '/3</p></div>'; } }
                c.innerHTML = h;
            } else if (tab === 'freefighters') {
                var free = allFighters.filter(function(f) { return !f.currentPromotionId; });
                var h = '<h2>👥 Свободные бойцы</h2>';
                if (free.length === 0) { h += '<p>Нет свободных бойцов</p>'; }
                else { for (var i = 0; i < free.length; i++) { var f = free[i]; h += '<div style="border:2px solid #CC0000; border-radius:10px; padding:10px; margin:5px 0;"><strong>' + f.fullName + '</strong> — ' + f.baseStyle + ' | ' + f.country + ' <button class="btn" style="width:auto;padding:5px 10px;font-size:12px;" onclick="signFighter(\'' + f.id + '\')">Подписать</button></div>'; } }
                c.innerHTML = h;
            }
        }

        function createCard() {
            var name = prompt('Название карда:');
            if (!name) return;
            var dateStr = prompt('Дата (ДД.ММ.ГГГГ):');
            if (!dateStr) return;
            var parts = dateStr.split('.');
            var date = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
            myPromotion.events.push({ id: 'e_' + Date.now(), name: name, date: date.toISOString(), fights: [] });
            showPromoterTab('cards');
        }

        function signFighter(fid) {
            var f = allFighters.find(function(x) { return x.id === fid; });
            if (f && myPromotion) { myPromotion.roster.push(f.id); f.currentPromotionId = myPromotion.id; alert(f.fullName + ' подписан!'); showPromoterTab('freefighters'); }
        }
    </script>
</body>
  </html>
