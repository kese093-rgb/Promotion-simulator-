<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promotion Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0A0E17;
            color: #E8ECF1;
            min-height: 100vh;
        }

        .screen {
            display: none;
            min-height: 100vh;
        }

        .screen.active {
            display: flex;
        }

        .menu-container {
            max-width: 900px;
            margin: 80px auto;
            padding: 40px;
            text-align: center;
            width: 100%;
        }

        .game-title {
            font-size: 56px;
            font-weight: 900;
            background: linear-gradient(135deg, #E31E24, #F59E0B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #8892B0;
            font-size: 18px;
            margin-bottom: 60px;
        }

        .save-slots {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 40px;
        }

        .slot-card {
            background: #1C2541;
            border: 2px solid #2D3A52;
            border-radius: 16px;
            padding: 40px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .slot-card:hover {
            border-color: #E31E24;
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(227, 30, 36, 0.2);
        }

        .slot-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .slot-card h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .slot-card p {
            color: #8892B0;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #E31E24;
            color: white;
        }

        .btn-primary:hover {
            background: #C41A20;
        }

        .btn-secondary {
            background: #3B82F6;
            color: white;
        }

        .btn-secondary:hover {
            background: #2563EB;
        }

        .btn-back {
            background: transparent;
            border: 2px solid #2D3A52;
            color: #8892B0;
            width: 100%;
            margin-top: 20px;
        }

        .btn-back:hover {
            background: #1C2541;
            color: #E8ECF1;
        }

        .btn-large {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            margin-top: 30px;
        }

        .creator-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 40px;
            background: #141B2D;
            border-radius: 16px;
            width: 100%;
        }

        .creator-container h2 {
            font-size: 32px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #8892B0;
        }

        .input {
            width: 100%;
            padding: 12px;
            background: #0A0E17;
            border: 2px solid #2D3A52;
            border-radius: 8px;
            color: #E8ECF1;
            font-size: 16px;
        }

        .input:focus {
            outline: none;
            border-color: #E31E24;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .appearance-section {
            margin: 30px 0;
            padding: 20px;
            background: #0A0E17;
            border-radius: 12px;
        }

        .appearance-section h3 {
            margin-bottom: 15px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
            width: 100%;
        }

        .sidebar {
            background: #141B2D;
            padding: 20px;
            border-right: 2px solid #2D3A52;
        }

        .main-content {
            padding: 30px;
            overflow-y: auto;
        }

        .card-mini {
            padding: 20px;
            background: #1C2541;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .dashboard-nav {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .nav-btn {
            width: 100%;
            padding: 12px;
            text-align: left;
            background: transparent;
            border: none;
            color: #8892B0;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: #1C2541;
            color: #E8ECF1;
        }

        .nav-btn.active {
            background: #E31E24;
            color: white;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .stat-card {
            background: #1C2541;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #2D3A52;
        }

        .stat-card h3 {
            font-size: 14px;
            color: #8892B0;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .stat-bar {
            height: 8px;
            background: #0A0E17;
            border-radius: 4px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s;
        }

        .bar-health {
            background: #10B981;
        }

        .bar-energy {
            background: #3B82F6;
        }

        .bar-morale {
            background: #F59E0B;
        }

        .data-table {
            width: 100%;
            background: #1C2541;
            border-radius: 12px;
            overflow: hidden;
            border-collapse: collapse;
        }

        .data-table th {
            background: #141B2D;
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: #8892B0;
        }

        .data-table td {
            padding: 16px;
            border-top: 1px solid #2D3A52;
        }

        .data-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .load-section {
            margin-top: 30px;
            padding: 20px;
            background: #1C2541;
            border-radius: 12px;
        }

        .load-section h3 {
            margin-bottom: 15px;
        }

        .save-item {
            padding: 12px;
            margin: 8px 0;
            background: #141B2D;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
        }

        .save-item:hover {
            background: #2D3A52;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .save-slots {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .game-title {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Главное меню -->
        <div id="main-menu" class="screen active">
            <div class="menu-container">
                <h1 class="game-title">Promotion Simulator</h1>
                <p class="subtitle">Реалистичный симулятор владельца промоушна единоборств</p>

                <div class="save-slots">
                    <div class="slot-card">
                        <div class="slot-icon">👤</div>
                        <h3>Слот 1: Карьера бойца</h3>
                        <p>Создайте бойца и пройдите путь к славе</p>
                        <button class="btn btn-primary" onclick="startCareer()">Начать карьеру</button>
                    </div>

                    <div class="slot-card">
                        <div class="slot-icon">🏢</div>
                        <h3>Слот 2: Промоутер</h3>
                        <p>Управляйте собственным промоушном</p>
                        <button class="btn btn-secondary" onclick="startPromoter()">Создать промоушн</button>
                    </div>
                </div>

                <div id="load-section" class="load-section" style="display:none;">
                    <h3>📂 Загрузить сохранение</h3>
                    <div id="saves-list"></div>
                </div>
            </div>
        </div>
